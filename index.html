     APP_BUILD in the script below reads this tag at runtime, and checkForUpdate() regexes this

<!--
==================================================================================
 IAN DASHBOARD  v21  (real estate pipeline populated, deployed to public URL with Ian's consent; premium lock screen; reorganized Real Estate; contact number in profile; Apple Health / Fitness look; Gym is today only; Claude avatar; merge import daily brief; native checkboxes + daily reset; section color coding; Home is the brief; lock screen, two profiles, full standalone pages)
 Single self contained file. No build step, no imports, no fetch, no CDN. Off disk.

 PRIVACY, IMPORTANT
  - This build contains real client names and sale prices in the Real Estate pipeline. Ian gave
    explicit consent to deploy it to the obscure public GitHub Pages URL so his pipeline shows
    automatically. Migrations are non-destructive and never wipe the day's in-progress entries.
  - The public GitHub Pages build is id-dash-v20-public.html, which carries all v20 design
    changes with a generic sample pipeline and no real client names or prices.
  - The same pipeline is also saved as real_estate_pipeline.json in this folder. A clean public
    build can stay empty and import that file privately on device (Load today's brief).

 NEW IN v21
  - Real Estate reorganized into a calm landing. The Real Estate tab now opens to a short menu of
    big tappable cards: Pipeline, Prospects, Things I need to do, and Tools. Each card shows a quick
    count and summary and opens its own focused screen with a back control. Pipeline keeps the
    collapsible stage grouping (Under contract, Coming soon, Active, Closed). Prospects holds the
    future listing clients. Things I need to do holds the follow ups. Tools holds the focus timer,
    activity counter, goals, leads, contacts, farm, scripts, and market notes. No data removed.

 NEW IN v20
  - Premium lock screen. Dark blue gradient with a soft radial glow behind a glossy app icon,
    round iOS style glass keypad buttons with a press animation, smooth animated dot fill, and a
    subtle shake on a wrong code. Same function: 4 digit passcode 2007, JS off fallthrough.
  - Contact number added to the Settings profile: 402-591-1133.
  - Real Estate reorganized. Pipeline leads as the focus, grouped into collapsible stage headers
    that show a count and dollar volume (active stages open by default, Closed and Prospects
    collapsed). Each deal is a simple row (name, price, close date, stage) that expands on tap for
    full editing. A compact Today strip (focus timer, activity counter, follow ups) sits up top,
    and secondary tools (leads, contacts, neighborhoods, scripts, market notes) tuck into
    collapsible sections lower down. Apple Health card styling and the pipeline stat tiles are kept.

 NEW IN v19 (real estate pipeline)
  - Pipeline populated with Ian's real deals, grouped by stage (Closed, Under contract / pending,
    Active listings, Coming soon, Prospects), each with name, price, stage, close date, and notes.
  - Stage subheaders show a count and total volume. A Pipeline summary of Apple style stat tiles
    shows counts and dollar volume by stage.
  - Two comps reruns and the Spicer close date confirmation were added as follow up tasks.
  - The merge import (Load today's brief) now also accepts a realEstate block, so the pipeline
    JSON merges into an existing device without wiping other data. Everything else is unchanged.

 NEW IN v18 (Apple Health / Fitness restyle, look only)
  - Near black page with cards a clear shade lighter (#1c1c1e) and soft rounded corners, so the
    boxes stand out from the background. Big bold white section titles with smaller gray subheads.
  - Apple style stat tiles: a small colored icon and label, a big number, and a small unit.
    Individual stats are color coded (red, green, blue, purple, orange, cyan, pink).
  - Fraction goal tiles for things to fill out, ring and bar style: workout sets X/total, habits
    X/7, water X/10, real estate calls X/target, focus blocks, pickleball sessions X/5. Each has a
    colored progress bar. Every section opens with an Apple style Summary of these tiles.
  - Mini bar charts inside cards (inline SVG free, animated), 2 column grids of stat cards, and
    tappable cards with a chevron that jump to their section.
  - Everything still works: passcode 2007, Claude avatar, brief import, focus timer, per section
    colors, native checkboxes with JS off, daily reset, CSS only tabs, today only gym, no dashes.

 NEW IN v17 (Gym tab shows today only)
  - The Gym tab now shows only the current day's workout. JavaScript reads the day of week and
    renders that day's session top to bottom: the pre workout warm up, the day title and focus,
    and every exercise with sets and reps and the set check offs. It auto advances each day, so
    Monday shows Push, Tuesday Pull, and Sunday shows the Sunday stretch session.
  - The other days are no longer shown by default. A small "View full week" link stays for
    reference and reveals the full split on demand, then hides again.
  - JS off fallback for the workout portion is a short note to open in Safari to see today's
    workout. Warm up, nutrition, supplements, and fitness goals stay visible statically.
  - Nutrition, supplements, goals, habits, and notes are unchanged. Everything else from v16
    (the organized layout, lock, avatar, brief import, timer, per section colors, checkboxes,
    daily reset, real estate command center, CSS only tabs, no dashes) is preserved.

 NEW IN v16 (organization pass, layout only, nothing removed)
  - One consistent layout system across every section. A single spacing and rounding scale,
    one section header style, one card treatment, and one type scale now apply everywhere
    (Home, Real Estate, Gym, Pickleball, Stats, More, Settings) through the shared classes.
  - Clearer block separation. Section headers get real breathing room above them so groups
    read as labeled blocks instead of a pile of cards.
  - Calmer accent use. The heavy accent stripe is thinned to a quiet cue, borders and shadows
    are softened, and the section accent color does the organizing work.
  - No feature, behavior, JavaScript, data model, or markup change. This is a CSS only pass.

 NEW IN v10
  - Lock screen. On load, a branded "Ian McCain" lock asks for a 4 digit passcode
    (2007) on a keypad. Correct code goes straight into the dashboard. The unlock is
    remembered for the browser session (Settings has a Lock action to re lock). This
    is a soft client side convenience lock, the code lives in the file. IMPORTANT:
    the lock is shown by JavaScript, so if JS is unavailable the app falls through
    and renders normally rather than trapping the user on a dead screen.
  - Every section is its own full standalone page. Home shows compact previews. Gym
    and Real Estate each have a Goals area, and Pickleball is its own full page.
  - Clickability audited end to end.

 Kept: blue accent, mobile first, CSS only tabs that switch with JS OFF, the card and
 accent bar aesthetic, animated stats, focus timer, storage fallback, export and
 import, PWA install, single self contained file, no dashes as separators.

 DATA MODEL / JSON SCHEMA
   Two profiles, two localStorage keys:
     ian   -> "ianDashboard.v1"
     chris -> "chrisDashboard.v1"
   Session unlock stored in sessionStorage "ianDash.session" = { unlocked, profile }.
   root (per profile) = {
     meta:{app,version,lastSaved},
     settings:{ name, accent, accent2, hidden:{} },
     objectives:{...},
     quickWin:{ items:[string], done:{ "date":true } },
     gym:{ warmup, notes, split:[...], logs:{}, goals:[{id,text,done}] },     // v10 goals
     nutrition:{...},
     realEstate:{ deals, leads, todos:[{id,text,done,due}], contacts, neighborhoods,
       marketNotes, routineTasks, metrics:{targets,log}, focus:{minutes,count}, scripts,
       goals:[{id,text,done}] },                                              // v10 goals
     routine:{ habits, checklist, checklistLog },
     pickleball:{ paddle, goals:[{id,text,done}], drills:[{id,text}], sessions:[...] }, // v10 drills
     goals:[...], todos:[...], notes, ideas:[...], context:{...}, events:[...], briefing:{...}
   }
   Chris uses the same realEstate shape (so the same builders work) plus a light
   routine and to dos, and no gym or pickleball.
==================================================================================
-->

/* v21 build 199: skills radar grow. The RESTING state is fully visible, and the animation is a
   keyframe played on top of it. That ordering matters. The previous version set the collapsed state
   inline and relied on a CSS transition to reach the visible state, which meant that if the
   transition did not run for any reason the radar stayed at scale(0), invisible, permanently. A
   cosmetic flourish must never be the thing that decides whether the chart can be seen. With a
   keyframe and no fill mode, the worst case is that the animation does not play and the chart is
   simply there, which is exactly the right failure. */
/* build 201: opacity finishes early, at 30 percent of the timeline, so the shape is solid for most
   of the grow and what he is watching is the SHAPE filling out rather than a fade. At the old 760ms
   the fade was over before you noticed it; at 1500ms a fade running the whole way would look like
   the chart was still loading. */
@keyframes skGrowIn{ from{ transform:scale(0); opacity:.35 } 30%{ opacity:1 } to{ transform:scale(1); opacity:1 } }
@keyframes skGrowSubtle{ from{ transform:scale(.92); opacity:.8 } 40%{ opacity:1 } to{ transform:scale(1); opacity:1 } }
/* v21 build 202: CHART ENTRANCE, everywhere. Ian watched the skills radar fill in and asked for the
   same slow grow on every chart and graph in the app. These are the keyframes; the driver is chRun().

   THE ONE RULE, and it is the reason build 199 had to be rewritten. Every keyframe below declares
   only a `from` (plus an early opacity landing). None of them declares a `to`. That means the end
   state is the element's OWN computed style, so the RESTING state of every chart is the finished
   chart and the animation is something played over the top of it. Nothing in here decides whether a
   chart can be seen. If the animation never runs, if the clock is frozen, if the JS path changes,
   the chart is simply there and correct. That is the only acceptable failure.

   Opacity lands at 30 percent of the timeline, carried over from build 201. Across 1500ms a fade
   that runs the whole way reads as "still loading"; landing it early means what he is watching is
   the SHAPE filling out, not the chart arriving.

   Each type gets the growth that belongs to it rather than one transform bolted onto everything.
   A bar grows UP from its baseline. A progress bar grows RIGHT from its left edge. A ring SWEEPS.
   A radial chart grows OUT from its own centre. A heatmap week WIPES left to right, Monday to
   Sunday, which is the direction time runs in it. Bars and pbars animate their natural dimension
   rather than a scale so their rounded caps do not squash mid flight. */
@keyframes chUp    { from{ height:0; opacity:.35 } 30%{ opacity:1 } }
@keyframes chRight { from{ width:0;  opacity:.35 } 30%{ opacity:1 } }
@keyframes chSweep { from{ stroke-dashoffset:239; opacity:.5 } 30%{ opacity:1 } }
/* build 203: chWipe is the ONE keyframe here that needs an explicit `to`, and the reason matters
   because the obvious tidy up is to delete it again. The implicit `to` is the element's computed
   style, which for clip-path is `none`, and `inset(...)` cannot interpolate to `none`. They are not
   the same type, so the browser falls back to a discrete flip: measured on the live build 202 the
   row sat at inset(0 100% 0 0), fully hidden, until the 30 percent mark and then popped to none. No
   wipe at all, and a heatmap invisible for the first third of its animation. inset -> inset
   interpolates cleanly. Verified by seeking the animation with the Web Animations API rather than
   by eye, because the automation window is backgrounded and cannot be trusted to paint. */
@keyframes chWipe  { from{ clip-path:inset(0 100% 0 0); opacity:.45 } 30%{ opacity:1 } to{ clip-path:inset(0 0 0 0) } }
@keyframes chFade  { from{ opacity:.15 } 40%{ opacity:1 } }
/* the subtle replay on a genuine re entry. Smaller and faster so a chart he comes back to still
   feels alive without turning into a tic. */
@keyframes chUpS   { from{ height:0; opacity:.8 } 40%{ opacity:1 } }
@keyframes chRightS{ from{ width:0;  opacity:.8 } 40%{ opacity:1 } }
@keyframes chSweepS{ from{ stroke-dashoffset:239; opacity:.85 } 40%{ opacity:1 } }
@keyframes chWipeS { from{ clip-path:inset(0 24% 0 0); opacity:.85 } 40%{ opacity:1 } to{ clip-path:inset(0 0 0 0) } }
@keyframes chFadeS { from{ opacity:.55 } 40%{ opacity:1 } }
@media (prefers-reduced-motion: reduce){
  /* belt and braces alongside the JS check, so the motion cannot play even if the JS path changes.
     Killing it here costs nothing, because the resting state already IS the finished chart. */
  .skgrow,.bar .fill,.pbar > i,.ring .prog,.hmcells,.orbgrow,.orbnode{ animation:none !important }
}

#p-stats{--sec:var(--cyan);--sec2:var(--cyan2)}

.a-blue{background:linear-gradient(90deg,var(--sec,var(--accent)),var(--sec2,var(--accent2)))}

/* ================= v16 organization pass (layout only, one consistent system) =================
   Visual polish only. No markup, JS, data, ID, or behavior changes. Every section (Home, Real
   Estate, Gym, Pickleball, Stats, More, Settings) already shares these classes through both the
   JS off static fallback and the JS on builders, so refining them here gives one deliberate,
   consistent layout everywhere: same header style, same card sizing, same spacing scale, same
   rounding, one type scale, and the section accent used as a calm organizing cue. */

/* one shared spacing + rounding scale, used across every section */
:root{ --r:18px; --r2:12px; --r3:999px; --gap:12px; --pad:18px; --block:24px; }

/* section header, identical treatment in every section, with real breathing room between blocks */
.sectlabel{
  margin:var(--block) 3px 12px; padding:2px 1px 8px;
  font-size:12.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase;
  color:var(--white); line-height:1.2;
  background:linear-gradient(180deg,var(--bg) 76%,rgba(5,5,6,0));
}

ration": "1h 4m 4s", "calories": 585, "activeCalories": 483, "avgHr": 116, "maxHr": 166, "note": "Drills, Omaha, 6:20 to 7:24 PM. Drilled serves 15-20 min, then drives and dinks the rest. Effort 7 of 10, Hard. From Apple Watch."}, {"id": "pk-20260710-openplay", "date": "2026-07-10", "kind": "Open play", "duration": "1h 4m 9s", "calories": 663, "activeCalories": 562, "avgHr": 123, "maxHr": 154, "note": "Ace Pickleball, Omaha, 5:17 to 6:21 PM. 15-20 min warm-up drilling, 10 min singles match, rest high-intensity doubles. Effort 8/10 Hard. From Apple Watch."}, {"id": "pk-20260712-openplay", "date": "2026-07-12", "kind": "Open play", "duration": "1h 38m 31s", "calories": 1039, "activeCalories": 882, "avgHr": 127, "maxHr": 166, "effort": 8, "note": "Omaha, 6:08 to 7:51 PM. Effort 8/10 Hard. From Apple Watch."}, {"id": "pk-20260713-league", "date": "2026-07-13", "kind": "League", "duration": "3h 24m 22s", "calories": 2482, "activeCalories": 2158, "avgHr": 140, "maxHr": 179, "minHr": 91, "effort": 10, "image": "Pickleball Sessions/07.13.2026 - Pickleball League Session (IMG_2511).png", "note": "League, final week, Omaha, 6:26 to 9:51 PM. Effort 10 of 10, All Out. From Apple Watch (Apple Fitness screenshot IMG_2511). Warm up: drilled drives 15 min, then dinks and drops 20 min. Played several doubles matches before league. League play: lost the first set 0 to 2 in close games (all played to 11, exact scores not recorded), then won the second set 2 to 0 (11 to 6 and 11 to 6). Finished the league in second place, losing to the number one team. Work on: on drives he gets antsy and moves forward as he hits, mishitting low most of the time. Played too much like a banger and was not fully consistent, should go for more drops and dinks, especially in the first set."}], "dayNote": "", "coachBullets": {"2026-07-22": ["Ian, yesterday was two hours forty of mixed open play, not the drill block you wanted. At 32 days out, one focused drill hour beats three casual nights, so protect one this week for drops and hands.", "Mixed doubles is Saturday if you enter it. You take every middle ball and the attackable ones, she holds her side, and together you aim low and cross court to the feet, never up the middle to the kitchen.", "Her dinks popping up is the same fault as yours, contact too close and too late. Give her one cue, hit it out in front and let it die, and drill ten minutes of soft cross court before the tournament.", "You filmed the last match for a reason. Run it through the video coach and let the footwork and drop numbers, not memory, tell you what to fix. Your own read was random errors and slow feet."], "2026-07-21": ["Contact out in front, on drops and on counters. In front you can see the ball and your paddle together. Beside your body you see neither, and that is the real source of the low mishits.", "New drop rule, replace the landing spot with the flight shape. Make it peak on your side, about head height of the player at the kitchen, so it is falling as it crosses.", "Ian, check your calendar. There is a Mixed Doubles Tournament sitting on Saturday the 25th, four days out. If it is real it is your first event, not Aug 23, so confirm it today.", "You bought the tripod, so use it today. Film the drop reps from behind the baseline and we get a real accuracy baseline instead of my guesswork.", "Zero sessions logged this week against a target of 5 to 6. Today is the restart you already planned, so take it."]}, "videoRec": {"2026-07-22": {"title": "How To Dominate In Mixed Doubles, Briones Pickleball", "url": "https://www.youtube.com/watch?v=Z0zTBr1MT_c", "note": "Straight to your Saturday game. Who takes the middle, how the stronger player shades to cover, and how to protect your partner's weaker side without leaving the line open."}, "2026-07-21": {"title": "18 minutes and you'll never miss a third shot drop again", "url": "https://www.youtube.com/watch?v=ANCNoC6tMPg", "note": "Names your exact fault. Contact out in front so you can see ball and paddle together, the shot peaking on your side, a locked wrist, and why the sideline is a trap."}, "2026-07-20": {"title": "Stacking 101: EVERYTHING You NEED To Know About Stacking", "url": "https://www.youtube.com/watch?v=dXU16wHK8iE", "note": "Last study day, and this is the one that sets up Week 2. Traditional stack on serve, the switch stack, hand signals, and why return stacking needs a deep return."}, "2026-07-19": {"title": "The 3rd Shot Drop is SO EASY When You Know This (Scientific Method)", "url": "https://www.youtube.com/watch?v=Cw6Iz0nS0ds", "note": "Turns your weakest shot into a measurable one. Landing band, net height band, speed window, and the sweet spot penalty that explains your netted drops."}, "2026-07-18": {"title": "Master speed up defense in doubles", "url": "https://www.youtube.com/watch?v=R3g_SFd_Lm4", "note": "Your weakest shot and the one a 3.5 bracket hunts. Watch it, then do 30 paddle up block reps in the room, soft hands, no swing."}, "2026-07-17": {"title":"Third shot drop breakdown, fix the float","url":"https://www.youtube.com/watch?v=2joz3UhHI9I","note":"Travel study day one. Drops are still number one for your 3.5 bracket. Do the opposite of their pace, only drop from inside the baseline, compact stroke, give margin over the net. Shadow swing 20 reps after."},"2026-07-16": {"title":"Defend the speed up, block and reset","note":"Your number two gap. Watch the block, not swing, motion, paddle up at chest, soft hands, redirect cross court low into the kitchen. Do the opposite of matching pace.","url":"https://www.youtube.com/results?search_query=pickleball+defend+speed+up+block+and+reset+drill"}, "2026-07-15": {"title": "Third shot drop, groove the soft game", "url": "https://www.youtube.com/results?search_query=pickleball+third+shot+drop+drill+2025", "note": "Ten minutes before the tournament. Lift from the legs, compact stroke, aim low at the kitchen line."}, "2026-07-13": {"title": "How to Hit a Reset, The Pickleball Clinic", "url": "https://www.youtube.com/watch?v=hwirvU2N-k4", "note": "League tonight. Soft hands, grip pressure around three to five, absorb pace and drop it into the kitchen."}}, "research": {"2026-07-22": {"title": "In mixed, cover the middle by forehand, not by gender", "text": "The old rule that the man takes everything down the middle is wrong. The player whose forehand sits in the middle takes the ball, so the partner never hits a defensive backhand, and the middle means the center line, not your body. Move together like you are tied by a two arm length string, when one of you shifts the other shifts too. That is how you stop giving up the gap that mixed teams get punished in.", "url": "https://www.thedinkpickleball.com/key-position-strategies-for-pickleball-mixed-doubles/", "source": "The Dink Pickleball, mixed doubles positioning, 07.22.2026"}, "2026-07-21": {"title": "Make the drop peak on your side of the net", "text": "Your drop should reach its highest point on YOUR side, roughly at the head height of the player at the kitchen, and already be falling as it crosses. If it peaks on their side it is still rising when it arrives, and a rising ball gets taken out of the air no matter where it would have landed. Easier to judge mid rally than any target on the floor.", "url": "https://www.youtube.com/watch?v=ANCNoC6tMPg", "source": "YouTube third shot drop full breakdown, 07.21.2026"}, "2026-07-20": {"title": "Only the server has to be in the right place", "text": "The whole legal basis for stacking is one rule: on the serve only the SERVER must be in the correct position, and the partner can stand anywhere, even off the court. On the return only the correct RETURNER matters. That is what lets you and Dylan put both forehands in the middle without breaking a rule. Start with the traditional stack on serve, serve then slide, and agree the signals now. Open hand means switch, closed hand means stay.", "url": "https://www.youtube.com/watch?v=dXU16wHK8iE", "source": "Briones Pickleball Academy, Stacking 101, pulled 07.19.2026"}, "2026-07-19": {"title": "A 3 mph miss is a netted drop", "text": "A baseline drop needs about 19 to 20 mph down the line and 22 to 23 cross court. Missing the center of the paddle costs roughly 3 mph, which is enough on its own to put the drop in the net. Your paddle is elongated with a high narrow sweet spot and your mishits run low on the face, so contact out front and up in the middle of the face is the fix.", "url": "https://www.youtube.com/watch?v=Cw6Iz0nS0ds", "source": "YouTube third shot drop scientific breakdown, 07.19.2026"}, "2026-07-18": {"title": "Do not swing at a speed up", "text": "The ball already carries the pace, so adding your own is how it sails long. Paddle up at chest and in front of your body, loose grip, and let the ball deflect soft into the kitchen. Block first, reset second, and only counter a ball that is clearly above the net.", "url": "", "source": "Speed up defense, coach knowledge base 07.18"}, "2026-07-17": {"title":"Win the middle as a team","text":"At 3.5 the middle and the weaker opponent decide matches. With Dylan, call the middle every ball, forehand in the middle takes it, get to the kitchen together, and talk on every ball. Most 3.5 points are lost on miscommunication and popped up balls, not missed winners.","url":"","source":"Doubles strategy, 07.17.2026"},"2026-07-16": {"title":"Grips: overgrip, hexagrip, trigger grip, my read for you","text":"You asked, so here it is. Overgrips are thin, about half a millimeter, so one wrap barely changes your grip size, which is exactly why they suit you coming from tennis and small grips. Yes, pros use them, the whole overgrip market came from tennis, Tourna is the classic. They add tack and soak up sweat, that grippier feel you already liked after regripping. The hexagrip you heard about is Hesacore, a hexagonal replacement grip that resists the paddle twisting on off center hits, pros do use it, but it is a full replacement that builds the handle up thicker, so for a small grip player it will feel bulkier, treat it as an off season experiment, not a tournament week change. The trigger grip has a molded finger ridge that locks your hand into one spot, that is why the reviews are mixed, it fights the fast grip switches pickleball needs, I would skip it for your game. My call, stay small, run one thin overgrip over your current grip for tack and sweat, skip the trigger, and park the hexagrip for later.","url":"https://www.pickletip.com/hesacore-pickleball-tour-grip/","source":"Grip research, 07.16.2026"}, "2026-07-15": {"title": "Reset under pace", "text": "When they speed up, soften the paddle face and take pace off, aim for a dead ball from your feet to their kitchen. It buys time to reset the point.", "url": "", "source": "Pickleball coaching notes, 07.15.2026"}, "2026-07-13": {"title": "Resets win with soft hands, not a swing", "text": "Under pressure keep grip pressure around three to five out of ten, contact out front with a slightly open face, and aim about two feet above the net so gravity drops the ball into the kitchen. Absorb the pace, do not add to it.", "url": "https://www.thedinkpickleball.com/how-to-hit-pickleball-resets-under-pressure/", "source": "The Dink Pickleball, 07.13.2026"}}, "coachRec": {"2026-07-22": {"title": "Drill mixed patterns before Saturday", "note": "Your next session should be a real drill block, not open play. Fifteen minutes of soft cross court dinks with your girlfriend on keeping the ball low, then you with Dylan or the club ball machine on drops that peak on your side. That covers Saturday's mixed game and the Aug 23 game at once."}, "2026-07-21": {"title": "Your drop and your hands are the same fix", "note": "Three separate sources this week diagnosed one fault behind both, letting the ball get too close and taking the paddle back. Contact out in front with no backswing pays into your weakest shot and your kitchen line at the same time. With a possible tournament Saturday, play out points this week rather than drilling only."}, "2026-07-20": {"title": "Watch the stack today, run it on serve tomorrow", "note": "Study is the assignment today, then Week 2 with Dylan is doubles patterns and it opens tomorrow. Bring one thing to the first session, the traditional stack on serve only, and leave everything else alone until it is automatic."}, "2026-07-19": {"title": "Grade drops by their contact point, not your landing spot", "note": "Stop asking whether the drop landed in the kitchen and start asking where their paddle was when they hit it. If they had to lift it from below the net, that was a good drop even if it drifted deep."}, "2026-07-18": {"title": "This weekend: speed up defense off court, then restart July 21 at 5 to 6 sessions", "note": "Your speed up defense is the weak spot you named yourself and the one a 3.5 bracket hunts, so spend the trip on film and 30 daily paddle up block reps with no ball. When you restart Tuesday, lead each session with drops and blocks while you are fresh, and get one court date with Dylan on the books."}, "2026-07-17": {"title":"This week: study drops and win the middle, no court until the 21st","note":"You are traveling through the 20th, so this week is film study and shadow reps, not drilling. Point each day at one weakness, drops first, then speed up defense, then 3.5 doubles positioning, so you come back sharp for the Aug 23 APC bracket with Dylan."},"2026-07-16": {"title":"This week: drops and speed up blocks, last court rep before the trip","note":"Today is your final on court session before you travel, so make it count on your two weak spots, low drops and blocking speed ups, then study on the road. See the coach plan for the week."}, "2026-07-15": {"title": "Next to train: low drops then speed up defense", "note": "Your July 14 open play leaned on pace with few focused drop reps. Spend the first ten minutes on drops that land low and unattackable, then five minutes of hands battles blocking the speed up, so tournament points do not run away from you."}, "2026-07-13": {"title": "Reset and drop before league", "note": "Your last week was mostly open play with one drill block Thursday, so the soft game has not had focused reps. Give it ten minutes tonight before league, feed yourself drops from the baseline and reset from mid court, the two shots that keep you on the line at the 25th."}}}, "goals": [{"id": "3lud02f", "text": "Lean out about 4 to 4.5 lb before the Tennessee and Lake of the Ozarks trip", "horizon": "Now", "done": false}, {"id": "kh3oypi", "text": "Keep the plan sustainable and actually enjoy it", "horizon": "Standing", "done": false}], "todos": [], "notes": "Brined over 1500 calories in pickleball session according to Apple Watch, with heartbeat over 139+ for more then half the time. Did not feel light headed today after loading a high carb, sodium, calorie meal for lunch, and a small carb snack before play", "ideas": [], "context": {"forClaude": "", "dailyLog": {"2026-07-06": {"note": "Busy real estate day in the morning, Pickleball league (Omaha) 6:29 to 9:13 PM: 2h 44m 35s, 1,897 cal (1,636 active), avg HR 139, max 181, min 84.", "summary": "Workout: Push, 4/5 logged. Habits: 6/6. Water: 12 glasses. Quick win: done. Real estate: 0 calls, 0 appts, 0 doors."}, "2026-07-07": {"note": "Staged a home from 10-2:30, a lot of walking and moving furniture (laborious) no pickleball today ", "summary": "Workout: Pull, 5/6 logged. Habits: 4/6. Water: 10 glasses. Quick win: done. Real estate: 0 calls, 0 appts, 0 doors.", "forClaudeArchive": "Check if any workout days need lightened, do a little more workout research to see if there\u2019s somewhere to improve, specefic to me of course", "claudeAction": "Read and acted on 07.07.2026. Lightened Monday push on league nights, OHP now optional to save energy, and added Tuesday auto regulation after long league nights. Updated the fitness plan and context. Archived this note her /* ===== v21 build 202: CHART REVEAL ==============================================================
   Ian watched the skills radar fill in and asked for the same slow entrance on every chart and graph
   in the app. This is the one driver that does it, for all of them. The radar's bespoke version from
   builds 196 to 201 is gone and the radar is registered here like everything else, keeping its own
   keyframes unchanged so what he already approved on his phone looks identical.

   WHAT THIS GUARANTEES, in priority order.

   1. EVERY CHART IS CORRECT WITH NO ANIMATION AT ALL. The builders now render their FINISHED state,
      and the keyframes up in the stylesheet declare only a `from`, so the resting state is the
      answer. This entire driver can fail and every chart still reads correctly. That is an inversion
      of what the app used to do: bars were built at height 0, rings at a full dash offset, progress
      bars at width 0, and the real values were painted in afterwards by the old animate(). Any chart
      whose animate step did not run was a chart of nothing. That is the same failure build 199 fixed
      on the radar, it was sitting in five other places, and it is worse than having no animation.
   2. IT NEVER REPLAYS ON A RE RENDER. render() runs on every checkbox tick, every cup of water,
      every saved note. A 1500ms crawl on each of those would be intolerable. A chart plays its full
      grow ONCE per key per session. After that, only a genuine tab entry earns the shorter replay.
   3. IT NEVER BLOCKS INTERACTION. Nothing animated here is a tap target. The radar's hit circles are
      built outside .skgrow, the orbit's contact nodes are faded in place and never moved or scaled,
      and a card carrying a bar or a ring is tappable on the card, not on the chart. Every tap target
      is full size and hit testable from frame zero.

   WHY NOT IntersectionObserver, so this is not relearned a third time. Build 196 tried it and it did
   not work. Every tab page is built once at render time and the inactive ones are display:none, so
   an observer registered against a hidden, detached subtree never reported the element when the tab
   was later switched on by the CSS radio, and the chart sat collapsed forever. The app already knows
   exactly when a section becomes visible: the tab radio changes. That is the trigger, plus a scroll
   check for a chart below the fold, plus one immediate check for a chart already on screen. */
var CH_FULL=1500;                 /* the slow grow */
var CH_SUB=700;                   /* the subtler replay on a genuine re entry */
var CH_EASE="cubic-bezier(.4,0,.25,1)";

   cubic-bezier(.19,.9,.32,1) puts about 62 percent of the growth into the first 20 percent of the
   time, which reads as snappy at 760ms but rubbery at 1500ms: the chart lurches out and then crawls
   to the finish with nothing left to watch. This curve is close to even, roughly 16 percent done a
   fifth of the way through, 60 at halfway, 92 at four fifths, so the motion stays visible the whole
   way and still lands softly instead of stopping dead. */

var CH_STAGGER_MAX=5;             /* capped, so a busy page does not push the last chart out to 2s */

   1500ms so the whole grid still finishes at about 1460ms: 7 x 120ms of stagger plus a 620ms row.
   Letting each row run the full 1500 would have taken the heatmap 2.7 seconds, which on the surface
   Ian opens the app to read is a delay, not a flourish. Same perceived duration, eight ordered
   steps instead of one. */

   rings' 1500ms rather than trailing past it. */
var CH_NODE=45, CH_NODE_MAX=560, CH_NODE_MS=700;

     the chart is simply sitting there finished, so a false negative costs nothing. */

     clock never advances parks the chart on that first frame. That is not hypothetical: it happens
     any time the page is not being painted, and it is exactly how two earlier attempts at the radar
     failed. So the fill is cleared on a plain timer, which keeps running when the animation clock

function priceNum(s){ const m=String(s||"").replace(/,/g,"").match(/\d+(\.\d+)?/); return m?parseFloat(m[0]):0; }
function fmtMoney(n){ try{ return "$"+Math.round(n).toLocaleString("en-US"); }catch(e){ return "$"+Math.round(n); } }
/* v21 build 38: commission / income model (07.08.2026). Seller side 3.75%, buyer side 2.4%.
   Brokerage NP Dodge takes 15% off the gross commission, the team keeps 85%. The post brokerage
   85% is split between Ian and Chris by the deal's source: Ian's own 90%, Chris's client 20%,
   Dual agency 50/50. Ian take home per deal = side% x price x 0.85 x source share.
   PRODUCTION stays sales volume (sum of prices), it is not income. These add an income estimate. */
function dealSource(d){ var s=(d&&d.source)||""; return (s==="Chris's client"||s==="Dual agency")?s:"Ian's own"; }
function dealSide(d){ var s=(d&&d.side)||""; if(s==="Buyer"||s==="Seller"||s==="Both") return s; /* v21 build 41: infer from the TITLE only, not the note, since notes often mention the clients buying elsewhere (Spicer and Bonks selling deals were wrongly read as Buyer). */ var t=String((d&&d.title)||""); return /buy|buyer|buying/i.test(t)?"Buyer":"Seller"; }
/* v21 build 57: a "Both" side is dual agency by definition and its commission is computed via dualRate in
   dealGrossCommission, so sideRate is only reached for SINGLE-side (non-dual) deals. The old "Both" branch
   here returned the retired additive 6.15% (3.75 + 2.4), which is wrong and was reachable if a deal was
   mis-tagged side "Both" without source "Dual agency" (the editor offers "Both sides" for any source).
   Fall back to the seller single-side rate so a mis-tag never applies the retired additive rate. No current
   deal hits this branch (Snyder and Brandon are Dual agency and use dualRate), so no displayed value changes. */
/* v21 build 67: the default single-side SELLER rate is now 3.6% (was 3.75%). It is a per-deal value:
   d.sellerRate overrides the 0.036 default, and is set to 0.037 (3.7%) for Chad Troester and Cynthia Willis
   ONLY (applied by mig67_rates). Buyer side stays 2.4%. Dual deals use dualRate, not this. */
function sellerRate(d){ return (d&&typeof d.sellerRate==="number")?d.sellerRate:0.036; }
function sourceShare(source,d){ if(d&&typeof d.ianSplit==="number") return d.ianSplit; return source==="Chris's client"?0.20 : source==="Dual agency"?0.50 : 0.90; }
/* v21 build 42: dual agency commission is 5% TOTAL on the sale price, charged ONCE for the property,
   NOT seller 3.75% plus buyer 2.4%. Matt Snyder is entered as two side-entries (buyer and seller) for
   volume and deal count, so each side-entry contributes HALF of the property's 5% gross, so the pair
   sums to one 5% charge (not double). A single-entry dual deal uses side "Both" and takes the full 5%.
   Volume and deal count still count both entries, only the take-home money is 5% once. */
/* v21 build 43: dual agency pays 4.5% of the sale price ONCE for the property (corrected down from 5%),
   then broker 15% and the Ian/Chris 50/50 split. A dual deal is now a single "Both" entry, so it takes the
   full 4.5%; the /2 branch is a safety net for any legacy single-side dual entry. */
/* v21 build 44: dual agency commission RATE is per deal. They aim for 6% and will go as low as 5% to make
   a deal work, so new dual deals default to 6% (editable down to 5%). Matt Snyder is a one-time 4.5%
   exception, stored on his deal. CRITICAL brokerage rule for dual: no matter the charged rate, the broker
   takes 15% of a fixed 6% basis (0.15 x 0.06 x price = 0.009 x price), NOT 15% of the charged rate. Ian's
   dual take-home = (chargedRate x price - 0.009 x price) x 0.50. Single-side deals are unchanged: 3.75%
   seller or 2.4% buyer, broker 15% of that side commission, then the 90% own / 20% Chris split. */
function dualRate(d){ return (d&&typeof d.dualRate==="number")?d.dualRate:0.06; }
function dealGrossCommission(d){ if(dealSource(d)==="Dual agency"){ var _full=priceNum(d&&d.price)*dualRate(d); return (dealSide(d)==="Both")?_full:_full/2; } var _sd=dealSide(d); return priceNum(d&&d.price) * (_sd==="Buyer"?0.024:sellerRate(d)); }
function dealBrokerage(d){ if(dealSource(d)==="Dual agency"){ var _fee=priceNum(d&&d.price)*0.15*0.06; return (dealSide(d)==="Both")?_fee:_fee/2; } return dealGrossCommission(d)*0.15; }
function dealIanNet(d){ return (dealGrossCommission(d)-dealBrokerage(d)) * sourceShare(dealSource(d),d); }
function sumIanNet(arr){ return (arr||[]).reduce(function(a,d){ return a+dealIanNet(d); },0); }
/* v21 build 43: a dual agency deal counts DOUBLE for production volume and for the deal count (both sides
   on one property), even though it shows as one entry. Non-dual deals count once.
   v21 build 45: briefly changed the deal COUNT to 1 for dual deals.
   v21 build 46: reverted per Ian. Dual deals again count TWO toward the 20-deal goal (Snyder + Brandon each
   contribute 2). VOLUME still counts double (2x price), see dealVolume. Only the count weight was reverted. */
function dealVolume(d){ return priceNum(d&&d.price) * (dealSource(d)==="Dual agency"?2:1); }
function dealCountWeight(d){ return dealSource(d)==="Dual agency"?2:1; }

function pkParseMin(s){ if(typeof s==="number") return s; s=String(s||""); if(!s.trim()) return 0; var h=(s.match(/(\d+)\s*h/i)||[])[1], m=(s.match(/(\d+)\s*m(?!s)/i)||[])[1], sec=(s.match(/(\d+)\s*s/i)||[])[1]; var mins=0; if(h)mins+=parseInt(h,10)*60; if(m)mins+=parseInt(m,10); if(sec)mins+=parseInt(sec,10)/60; if(!h&&!m&&!sec){ var n=parseFloat(s); if(!isNaN(n)) mins=n; } return Math.round(mins*10)/10; }
function pkEffort(s){ if(s&&typeof s.effort==="number") return s.effort; var t=String(s&&s.note||""); var m=t.match(/effort\s*(\d+(?:\.\d+)?)\s*(?:of|\/)\s*10/i); return m?parseFloat(m[1]):null; }
function pkSorted(){ return (((state.pickleball&&state.pickleball.sessions)||[]).filter(function(s){return s&&s.date;})).slice().sort(function(a,b){return String(a.date).localeCompare(String(b.date));}); }
function pkLatest(map){ if(!map||typeof map!=="object") return null; var ks=Object.keys(map).sort(); return ks.length?map[ks[ks.length-1]]:null; }
function pkTrend(a,n){ n=n||3; if(!a||a.length<2) return 0; var last=a.slice(-n); var prior=a.slice(-2*n,-n); if(!prior.length) prior=a.slice(0,a.length-last.length); if(!prior.length) return 0; var avg=function(x){return x.reduce(function(p,q){return p+q;},0)/x.length;}; return avg(last)-avg(prior); }
function pkStats(){ var ss=pkSorted(); var wk=ss.filter(function(s){var d=daysUntil(s.date);return d>=-6&&d<=0;}); var pw=ss.filter(function(s){var d=daysUntil(s.date);return d>=-13&&d<=-7;}); var mo=ss.filter(function(s){var d=daysUntil(s.date);return d>=-29&&d<=0;}); var totalMin=ss.reduce(function(a,s){return a+pkParseMin(s.duration);},0); var wkMin=wk.reduce(function(a,s){return a+pkParseMin(s.duration);},0); var hr=ss.filter(function(s){return s.avgHr;}).map(function(s){return s.avgHr;}); var eff=ss.map(pkEffort).filter(function(e){return e!=null;}); var cal=ss.filter(function(s){return s.calories;}).map(function(s){return s.calories;}); return {ss:ss,wk:wk,pw:pw,mo:mo,totalMin:totalMin,wkMin:wkMin,hr:hr,eff:eff,cal:cal}; }
function pkNextEvent(){ var ev=((state&&state.events)||[]).filter(function(e){ return e&&e.date&&daysUntil(e.date)>=0 && (/league|tournament|pickle/i.test(String(e.kind||"")+" "+String(e.title||""))); }).sort(function(a,b){return daysUntil(a.date)-daysUntil(b.date);}); return ev[0]||null; }
function pkInsights(st){ var out=[]; if(!st.ss.length){ return ["Log a few sessions and your coach will start spotting trends here."]; } var wkN=st.wk.length, pwN=st.pw.length; out.push(wkN+" session"+(wkN===1?"":"s")+" this week"+((pwN||wkN)?(", "+(wkN>pwN?("up from "+pwN):wkN<pwN?("down from "+pwN):"same as")+" last week"):"")+"."); if(st.wkMin>0) out.push(Math.round(st.wkMin)+" minutes on court this week."); var wl=pkRecord(st.ss); if(wl.w+wl.l>0) out.push("Record "+wl.w+" and "+wl.l+" across logged matches"+(wl.w+wl.l>=3?", "+(wl.w>=wl.l?"winning more than losing":"keep grinding the close ones"):"")+"."); if(st.eff.length>=2){ var et=pkTrend(st.eff); out.push("Effort "+(et>0.3?"trending up":et<-0.3?"easing off":"holding steady")+", last logged "+st.eff[st.eff.length-1]+" of 10."); } if(st.hr.length>=2){ var ht=pkTrend(st.hr); out.push("Average HR "+(ht>2?"climbing":ht<-2?"coming down":"steady")+", recent "+Math.round(st.hr[st.hr.length-1])+" bpm."); } var ne=pkNextEvent(); if(ne){ var du=daysUntil(ne.date); out.push(ne.title+" "+(du===0?"today":du===1?"tomorrow":"in "+du+" days")+". Bank touch reps and keep your legs fresh."); } return out; }
