<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050506">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ian">
<title>Ian Dashboard</title>
<!-- THE BUILD STAMP LIVES HERE AND NOWHERE ELSE. The script reads this tag and the update check reads the same tag from the fetched page. -->
<meta name="build" content="v21 build 637 (2026-11-24)">
<style>
/* KIT BEGIN */
/* Tokens. Values are fixed by PLAN 3.1 and DESIGN_SPEC.md. Pages add no colors. */
:root{
  --bg:#050506; --bg2:#0d0d10; --card:#141418; --card2:#1c1c22;
  --line:#26262e; --line2:#33333c; --cell:#20202a;
  --white:#f5f6f8; --gray:#b9bbc2; --gray2:#8b8d94; --dim:#5c5e66;
  --accent:#2f6bff; --accent2:#6fa8ff; --green:#2fd27a; --amber:#ff8a34; --red:#ff5a5a;
  --teal:#12b5a0; --violet:#9b6bff; --slate:#8492a8;
  --r:18px; --r2:12px; --hh:54px; --bh:60px; --pad:16px; --gap:12px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --mo-1:120ms; --mo-2:240ms; --mo-3:360ms; --mo-4:520ms;
  --mo-std:cubic-bezier(.22,1,.36,1); --mo-emph:cubic-bezier(.2,.7,.2,1); --mo-exit:cubic-bezier(.4,0,1,1);
  --mo-step:28ms;
  font-family:"Helvetica Neue",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0;background:var(--bg);color:var(--white)}
body{font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;overflow-x:hidden}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.02em}
button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit;background:none;border:0;padding:0;text-align:inherit}
a{color:var(--accent2);text-decoration:none}
svg.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.num{font-variant-numeric:tabular-nums}

/* Shell: lock screen (look carried from build 635) */
.lock{display:none;position:fixed;inset:0;z-index:200;overflow:auto;
  background:
    radial-gradient(62% 48% at 20% 16%,rgba(84,150,255,.46) 0%,rgba(24,52,110,0) 60%),
    radial-gradient(70% 55% at 90% 94%,rgba(120,180,255,.22) 0%,rgba(0,0,0,0) 55%),
    linear-gradient(155deg,#0a1a38 0%,#0b1e42 28%,#08142c 60%,#050c1e 100%);
  padding:calc(var(--sat) + 16px) 16px calc(var(--sab) + 16px)}
body.locked .lock{display:block}
body.locked .app{display:none}
.lock-in{max-width:360px;min-height:100%;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.lock-logo{position:relative;width:60px;height:60px;border-radius:18px;display:grid;place-items:center;margin-bottom:12px;
  background:linear-gradient(150deg,#4aa3ff 0%,#0a84ff 46%,#0052d6 100%);font-weight:900;font-size:24px;letter-spacing:-.05em;color:#eef5ff;
  box-shadow:0 14px 38px rgba(12,110,255,.5),0 2px 6px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.4)}
.lock-brand{font-size:24px;font-weight:800;letter-spacing:-.03em;color:#f5f8ff}
.lock-sub{color:#9fb2d4;font-size:13.5px;margin-top:8px;font-weight:600;min-height:20px;transition:color .2s}
.lock-sub.err{color:#ff6b6b}
.dots{display:flex;justify-content:center;gap:16px;margin:16px 0 32px}
.dot{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.08);border:1.5px solid rgba(150,180,230,.45);
  transition:transform .2s cubic-bezier(.2,.85,.25,1.4),background .2s,box-shadow .2s,border-color .2s}
.dot.on{background:linear-gradient(150deg,#67b4ff,#0a84ff);border-color:#4aa8ff;transform:scale(1.2);box-shadow:0 0 13px rgba(24,124,255,.8)}
.dots.shake{animation:shake 360ms var(--mo-emph)}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.keypad{display:grid;grid-template-columns:repeat(3,70px);grid-auto-rows:70px;justify-content:center;gap:20px 28px}
.key{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:29px;font-weight:400;
  background:linear-gradient(160deg,rgba(255,255,255,.17),rgba(255,255,255,.045));
  border:1.5px solid rgba(255,255,255,.30);
  box-shadow:0 8px 22px rgba(0,10,40,.42),inset 0 1px 0 rgba(255,255,255,.26);
  transition:transform .1s ease,background .1s,box-shadow .1s}
.key:active{transform:scale(.9);background:linear-gradient(160deg,rgba(120,175,255,.42),rgba(58,120,220,.24))}
.key.fn{background:none;border:0;box-shadow:none;color:#9fb2d4}

/* Shell: header, page host, tab bar */
.hdr{position:sticky;top:0;z-index:50;height:calc(var(--hh) + var(--sat));padding:var(--sat) 6px 0 var(--pad);
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(5,5,6,.82);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);
  border-bottom:1px solid rgba(255,255,255,.05)}
.hdr h1{font-size:22px;line-height:1.1}
.hdr-sub{font-size:11.5px;font-weight:600;color:var(--gray2);margin-top:2px}
.ibtn{width:44px;height:44px;display:grid;place-items:center;color:var(--gray);border-radius:50%}
.ibtn:active{background:rgba(255,255,255,.08)}
.page{padding:var(--pad) var(--pad) calc(var(--bh) + var(--sab) + 24px);max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:var(--gap)}
.page>*{animation:rise var(--mo-3) var(--mo-std) both}
.page>*:nth-child(2){animation-delay:var(--mo-step)}
.page>*:nth-child(3){animation-delay:calc(var(--mo-step)*2)}
.page>*:nth-child(4){animation-delay:calc(var(--mo-step)*3)}
.page>*:nth-child(5){animation-delay:calc(var(--mo-step)*4)}
.page>*:nth-child(n+6){animation-delay:calc(var(--mo-step)*5)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:60;height:calc(var(--bh) + var(--sab) + 1px);padding:0 4px var(--sab);
  display:flex;background:rgba(13,13,16,.9);-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);
  border-top:1px solid rgba(255,255,255,.07)}
.tab{flex:1 1 0;min-width:0;height:var(--bh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--dim);font-size:10.5px;font-weight:700;letter-spacing:.01em;position:relative;transition:color var(--mo-2) var(--mo-std)}
.tab svg.ic{transition:transform var(--mo-2) var(--mo-std)}
.tab.on{color:var(--white)}
.tab.on svg.ic{color:var(--accent2);transform:translateY(-1px)}
.tab::before{content:"";position:absolute;top:0;left:50%;width:22px;height:2px;margin-left:-11px;border-radius:2px;background:var(--accent);
  transform:scaleX(0);transition:transform var(--mo-2) var(--mo-std)}
.tab.on::before{transform:none}
.tab:active svg.ic{transform:scale(.9)}
.upd{position:fixed;left:var(--pad);right:var(--pad);top:calc(var(--sat) + var(--hh) + 8px);z-index:70;min-height:44px;padding:0 16px;
  display:none;align-items:center;justify-content:space-between;gap:12px;border-radius:14px;background:var(--accent);color:#fff;
  font-size:14px;font-weight:700;box-shadow:0 10px 28px rgba(0,0,0,.5)}
.upd.show{display:flex}
.upd b{font-weight:800;text-decoration:underline}

/* Kit: card */
.card{background:var(--card);border:1px solid rgba(255,255,255,.05);border-radius:var(--r);padding:var(--pad);min-width:0}
.card.flush{padding:0;overflow:hidden}
.card.tap{cursor:pointer;transition:transform var(--mo-1) var(--mo-std)}
.card.tap:active{transform:scale(.985)}
.card.hero{position:relative;overflow:hidden;padding:20px;border-color:rgba(255,255,255,.06);
  background:radial-gradient(120% 90% at 100% 0%,var(--tint,rgba(47,107,255,.26)) 0%,rgba(0,0,0,0) 60%),linear-gradient(160deg,#10131c 0%,#0d0e13 100%);
  box-shadow:0 12px 32px rgba(0,0,0,.45)}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.card.flush>.card-h{padding:14px var(--pad) 0;margin-bottom:6px}
.card-t{font-size:15px;font-weight:700;letter-spacing:-.01em}
.card-s{font-size:12px;color:var(--gray2);font-weight:600;white-space:nowrap}
.card-b{display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flush>.card-b{gap:0}
.card>.foot{margin-top:12px}
.card.flush>.foot{margin:0;padding:10px var(--pad) 12px;border-top:1px solid rgba(255,255,255,.05)}

/* Kit: section head, hero number, stat chips */
.sec{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 4px -4px;
  font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gray)}
.sec span{font-weight:600;letter-spacing:0;text-transform:none;color:var(--gray2);font-size:12px}
.hero-k{font-size:13px;font-weight:600;color:var(--gray)}
.hero-big{display:flex;align-items:baseline;gap:8px;margin-top:4px;flex-wrap:wrap}
.hero-big b{font-size:40px;line-height:1.05;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hero-big span{font-size:16px;font-weight:700;color:var(--white)}
.hero-sub{font-size:13px;color:var(--gray);margin-top:4px}
.chips{display:flex;gap:8px}
.chip{flex:1 1 0;min-width:0;background:var(--card);border:1px solid rgba(255,255,255,.05);border-radius:14px;padding:10px 12px}
.chip b{display:block;font-size:19px;line-height:1.2;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip span{display:block;font-size:11px;line-height:1.3;color:var(--gray);margin-top:2px}

/* Tones. One class sets the color a component paints with. */
.t-accent{--tone:var(--accent)} .t-green{--tone:var(--green)} .t-amber{--tone:var(--amber)} .t-red{--tone:var(--red)}
.t-teal{--tone:var(--teal)} .t-violet{--tone:var(--violet)} .t-slate{--tone:var(--slate)} .t-white{--tone:var(--white)}
.tone-fg{color:var(--tone,var(--white))}
/* Stage colors, same on every page */
.st-uc{--tone:var(--accent)} .st-live{--tone:var(--green)} .st-cs{--tone:var(--amber)} .st-closed{--tone:var(--slate)}
/* Money bar buckets. Five colors carried exactly from build 619. s-owed added 23 Nov (teal, an existing token, no new color). */
.s-closed{--tone:var(--green)}
.s-owed{--tone:var(--teal)}
.s-uc{--tone:#da8fff}
.s-cs{--tone:rgba(48,209,88,.58)}
.s-bd{--tone:rgba(48,209,88,.32)}
.s-pr{--tone:rgba(255,255,255,.24)}
.st-uc,.st-live,.st-cs,.st-closed,.s-closed,.s-owed,.s-uc,.s-cs,.s-bd,.s-pr{background:var(--tone)}
/* Hero card tint follows the tone */
.hero.t-accent{--tint:rgba(47,107,255,.26)} .hero.t-green{--tint:rgba(47,210,122,.24)} .hero.t-teal{--tint:rgba(18,181,160,.24)}
.hero.t-violet{--tint:rgba(155,107,255,.24)} .hero.t-amber{--tint:rgba(255,138,52,.22)} .hero.t-slate{--tint:rgba(132,146,168,.2)}

/* Motion: grow once on entering view. Visible by default, armed by script only when motion is allowed. */
.gr{transform-origin:left center}
.gr.arm{transform:scaleX(0)}
.gr.arm.in{transform:none;transition:transform 700ms var(--mo-emph);transition-delay:calc(var(--i,0)*60ms)}

/* Kit: segmented bar with legend */
.seg{display:flex;gap:2px;height:12px;border-radius:6px;overflow:hidden}
.seg i{display:block;flex-basis:0;min-width:6px;height:100%;border-radius:3px;background:var(--tone,var(--slate))}
.seg i.ghost{opacity:.45;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.35) 0 3px,rgba(255,255,255,0) 3px 6px)}
.seg.empty{background:var(--cell)}
.leg{display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:10px}
.leg-i{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--gray);min-width:0}
button.leg-i{min-height:44px}
.leg.tap .leg-i{min-height:44px}
.leg-i i{flex:0 0 8px;width:8px;height:8px;border-radius:50%;background:var(--tone,var(--slate))}
.leg-i b{color:var(--white);font-weight:700;font-variant-numeric:tabular-nums}

/* Kit: progress bar */
.pb-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:13px;margin-bottom:8px}
.pb-h span:first-child{font-weight:700}
.pb-h span:last-child{color:var(--gray);font-variant-numeric:tabular-nums;white-space:nowrap}
.pb-t{position:relative;height:10px;border-radius:5px;background:var(--cell)}
.pb-c{position:absolute;inset:0;border-radius:5px;overflow:hidden;display:flex}
.pb-f{height:100%;background:var(--tone,var(--accent));border-radius:5px}
.pb-g{height:100%;background:var(--tone,var(--accent));opacity:.4;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.4) 0 3px,rgba(255,255,255,0) 3px 6px)}
.pb-m{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;border-radius:1px;background:var(--white)}
.pb-ml{position:relative;height:16px;margin-top:5px;font-size:10.5px;font-weight:700;color:var(--gray2)}
.pb-ml span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.pb-ml span.l{transform:none} .pb-ml span.r{transform:translateX(-100%)}

/* Kit: paired bars */
.pr-row{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;padding:7px 0}
.pr-row+.pr-row{border-top:1px solid rgba(255,255,255,.04)}
.pr-l{font-size:12px;font-weight:700;color:var(--gray)}
.pr-b{display:flex;flex-direction:column;gap:3px;min-width:0}
.pr-b i{display:block;height:7px;border-radius:3.5px;min-width:3px;background:var(--green)}
.pr-b i+i{background:var(--slate)}
.pr-v{font-size:11.5px;line-height:1.35;text-align:right;font-variant-numeric:tabular-nums;color:var(--gray)}
.pr-v b{display:block;color:var(--white);font-weight:700}

/* Kit: heat strip (the heatmap idea, one row) */
.hs{display:flex;gap:4px}
.hs-c{flex:1 1 0;min-width:0;text-align:center}
.hs-l{font-size:10px;font-weight:700;color:var(--gray2);margin-bottom:4px}
.hs-b{position:relative;aspect-ratio:1/1;border-radius:5px;background:var(--cell);overflow:hidden;display:grid;place-items:center}
.hs-b i{position:absolute;inset:0;background:var(--tone,var(--green));opacity:0}
.hs-b b{position:relative;font-size:10.5px;font-weight:800;color:var(--white);font-variant-numeric:tabular-nums}
.hs-c.l0 .hs-b b{color:var(--dim)}
.hs-c.l1 .hs-b i{opacity:.25} .hs-c.l2 .hs-b i{opacity:.48} .hs-c.l3 .hs-b i{opacity:.74} .hs-c.l4 .hs-b i{opacity:1}
.hs-c.l3 .hs-b b,.hs-c.l4 .hs-b b{color:#04130b}
.hs-c.fut .hs-b{background:transparent;border:1px dashed var(--line2)}
.hs-c.now .hs-l{color:var(--white)}
.hs-k{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:9px;font-size:10.5px;font-weight:700;color:var(--gray2)}
.hs-k span{display:flex;align-items:center;gap:3px}
.hs-k i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--tone,var(--green))}

/* Kit: timeline */
.tl-a{position:relative;height:22px;margin:0 6px}
.tl-a::before{content:"";position:absolute;left:-6px;right:-6px;top:10px;height:2px;border-radius:1px;background:var(--line2)}
.tl-d{position:absolute;top:5px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--tone,var(--accent));border:2px solid var(--card)}
.tl-e{display:flex;justify-content:space-between;font-size:10.5px;font-weight:700;color:var(--gray2);margin-top:2px}
.tl-r{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13px}
.tl-r+.tl-r{border-top:1px solid rgba(255,255,255,.04)}
.tl-r i{flex:0 0 8px;width:8px;height:8px;border-radius:50%;background:var(--tone,var(--accent))}
.tl-r span{flex:0 0 auto;min-width:58px;white-space:nowrap;color:var(--gray);font-weight:700;font-variant-numeric:tabular-nums}
.tl-r b{flex:1 1 auto;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-r em{font-style:normal;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tl-list{margin-top:8px}

/* Kit: expand row */
.xr{border-top:1px solid rgba(255,255,255,.05)}
.xr:first-child{border-top:0}
.xr-h{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px var(--pad)}
.xr.open{background:rgba(255,255,255,.035)}
.xr-dot{flex:0 0 8px;width:8px;height:8px;border-radius:50%;background:var(--tone,var(--slate))}
.xr-l{flex:1 1 auto;min-width:0}
.xr-r{flex:0 0 auto;text-align:right}
.xr-n{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:700;min-width:0}
.xr-n>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.xr-s{font-size:12px;color:var(--gray);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xr-t{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.xr-ch{flex:0 0 16px;width:16px;height:16px;color:var(--dim);transition:transform var(--mo-2) var(--mo-std)}
.xr-ch svg.ic{width:16px;height:16px}
.xr.open .xr-ch{transform:rotate(90deg)}
.xr-d{display:none;padding:0 var(--pad) 12px 36px}
.xr.open .xr-d{display:block;animation:rise var(--mo-2) var(--mo-std) both}
.kv{display:flex;gap:10px;padding:6px 0;font-size:12.5px;line-height:1.4;border-top:1px solid rgba(255,255,255,.04)}
.kv:first-child{border-top:0}
.kv span{flex:0 0 96px;color:var(--gray)}
.kv b{flex:1 1 auto;min-width:0;font-weight:500;color:var(--white);overflow-wrap:anywhere}

/* Kit: tag, empty line, as of foot */
.tag{display:inline-block;flex:0 0 auto;padding:1px 7px;border-radius:999px;font-size:10.5px;line-height:1.5;font-weight:700;letter-spacing:.02em;white-space:nowrap;
  color:var(--tone,var(--gray));background:rgba(255,255,255,.08)}
.empty{font-size:13px;color:var(--gray2);padding:4px 2px}
.card.flush .empty{padding:14px var(--pad)}
.foot{font-size:11.5px;line-height:1.45;color:var(--gray2)}
.foot .tag{margin-left:6px}

/* Kit: bottom sheet */
.sh-bg{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);opacity:0;transition:opacity var(--mo-2) var(--mo-std)}
.sh{position:fixed;left:0;right:0;bottom:0;z-index:101;max-height:88vh;display:flex;flex-direction:column;
  background:var(--card2);border-radius:22px 22px 0 0;border-top:1px solid rgba(255,255,255,.08);
  transform:translateY(100%);transition:transform var(--mo-3) var(--mo-std)}
.sh-on .sh-bg{opacity:1} .sh-on .sh{transform:none}
.sh-out .sh{transition:transform var(--mo-2) var(--mo-exit)}
.sh-h{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:10px 6px 4px var(--pad)}
.sh-h::before{content:"";position:absolute;top:6px;left:50%;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:var(--line2)}
.sh-h h2{font-size:18px;padding-top:8px}
.sh-b{flex:1 1 auto;overflow:auto;-webkit-overflow-scrolling:touch;padding:8px var(--pad) calc(var(--sab) + 20px);display:flex;flex-direction:column;gap:12px}
.sh-b .card{background:var(--card)}

/* fmtMoney(8590000) "$8.59M", fmtMoney(1883.74) "$1,883.74", fmtMoney(null) "unknown". Options: full (no M), short (K above 1,000), cents true or false. */
K.fmtMoney=function(v,o){
  if(!isNum(v))return "unknown";
  o=o||{}; var a=Math.abs(v), s;
  if(a>=1e6&&!o.full){ s=(a/1e6).toFixed(2).replace(/\.?0+$/,"")+"M"; }
  else if(o.short&&a>=1000){ s=(a/1000).toFixed(1).replace(/\.0$/,"")+"K"; }
  else{
    var cents=o.cents===true||(o.cents!==false&&Math.round(a*100)%100!==0);
    if(cents){ var p=a.toFixed(2).split("."); s=group(p[0])+"."+p[1]; } else { s=group(Math.round(a)); }
  }
  return (v<0?"-$":"$")+s;
};
/* A range stays a range. Equal ends print once. */
K.fmtRange=function(lo,hi,o){ if(!isNum(lo)&&!isNum(hi))return "unknown"; if(!isNum(hi)||lo===hi)return K.fmtMoney(lo,o); if(!isNum(lo))return K.fmtMoney(hi,o); return K.fmtMoney(lo,o)+" to "+K.fmtMoney(hi,o); };

K.fmtDate=function(s,o){
  var p=parseDate(s); if(!p||p.m<1||p.m>12)return "unknown"; o=o||{};
  if(p.d===null)return MON[p.m-1]+" "+p.y;
  var out=MON[p.m-1]+" "+p.d;
  if(o.year||p.y!==new Date().getFullYear())out+=", "+p.y;
  if(o.time&&p.hh!==null){ var h=p.hh%12; if(h===0)h=12; out+=", "+h+":"+(p.mm<10?"0":"")+p.mm+(p.hh<12?" AM":" PM"); }
  return out;
};

  io=new IntersectionObserver(function(es){ es.forEach(function(e){ e.target._seen=true; if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } }); },{threshold:0});
}
function grow(n,i){
  n.classList.add("gr"); if(REDUCED)return n;
  n.classList.add("arm"); if(i)n.style.setProperty("--i",String(i));
  if(io)io.observe(n);
  setTimeout(function(){
    if(n.classList.contains("in"))return;
    var box=n.parentNode&&n.parentNode.getBoundingClientRect?n.parentNode.getBoundingClientRect():null;
    var onScreen=box&&box.width>0&&box.top<window.innerHeight&&box.bottom>0;

K.countUp=function(node,to,fmt,ms){
  var done=false; function fin(){ if(done)return; done=true; node.textContent=fmt(to,true); }
  if(REDUCED||!isNum(to)||!window.requestAnimationFrame){ fin(); return node; }
  ms=ms||900; var t0=null; node.textContent=fmt(0,false);
  function step(t){ if(done)return; if(t0===null)t0=t; var k=Math.min(1,(t-t0)/ms); if(k>=1){ fin(); return; } node.textContent=fmt(to*(1-Math.pow(1-k,3)),false); requestAnimationFrame(step); }
  requestAnimationFrame(step); setTimeout(fin,ms+400); return node;
};

APP.pages.home=function(host,data){
  var P=data.production||{}, deals=data.deals||[], inc=data.income||{}, flags=data.flags||[];
  function isN(v){ return typeof v==="number"&&isFinite(v); }
  function r2(v){ return Math.round(v*100)/100; }
  var STAGE_CLS={under_contract:"st-uc",live:"st-live",coming_soon:"st-cs",closed:"st-closed"};
  var goal=P.goal, closed=P.closedVolume;

  /* 1. Production hero */
  var soon=(P.closingSoon||[]).filter(function(c){ return isN(c.volume); });
  var soonSum=soon.reduce(function(a,c){ return a+c.volume; },0);
  var soonLast=soon.reduce(function(a,c){ return (!a||String(c.date)>a)?String(c.date):a; },"");
  var toGo=(isN(goal)&&isN(closed))?Math.max(0,goal-closed):null;
  var heroBody=[
    K.hero({label:"Closed production "+(P.year||""),value:isN(closed)?closed:null,format:"money",unit:isN(goal)?"of "+K.fmtMoney(goal):"",sub:toGo===null?"unknown":K.fmtMoney(toGo)+" to go",tone:"accent"}),
    K.progressBar({value:closed,max:goal,ghost:soonSum>0?soonSum:null,tone:"accent",marks:isN(goal)?[{at:goal}]:[]})
  ];
  if(soonSum>0)heroBody.push(K.el("div","hero-sub","+"+K.fmtMoney(soonSum,{short:true})+" closing by "+K.fmtDate(soonLast)));
  host.appendChild(K.card({hero:true,tone:"accent",body:heroBody,foot:K.asOfFoot({source:P.closedSource,asOf:P.closedAsOf})}));

  /* 2. Stat chips */
  var owedSum=r2((inc.owed||[]).reduce(function(a,o){ return a+(isN(o.amount)?o.amount:0); },0));
  var tx=P.transactions&&isN(P.transactions.count)?String(P.transactions.count):null;
  host.appendChild(K.chipRow([
    {value:tx,label:"Transactions"},
    {value:K.fmtMoney(owedSum),label:"Owed to you",tone:owedSum>0?"teal":"slate"}
  ]));

  /* shared: newest as of on the deal board */
  var boardAsOf=deals.reduce(function(a,d){ return (d.asOf&&String(d.asOf)>a)?String(d.asOf):a; },"");

  /* 3. Pipeline bar */
  var STAGES=[["under_contract","Under contract"],["live","Live now"],["coming_soon","Coming soon"],["closed","Closed"]];
  var pipeSegs=STAGES.map(function(s){
    var n=deals.filter(function(d){ return d.stage===s[0]; }).length;
    return {value:n,label:s[1],cls:STAGE_CLS[s[0]]};
  });
  host.appendChild(K.card({title:"Pipeline",sub:"Deal board",body:K.segBar({segments:pipeSegs}),foot:K.asOfFoot({source:"Deal board",asOf:boardAsOf})}));

  /* 4. Money bar */
  var BUCKETS=[["received","Received","s-closed",false],["owed","Owed","s-owed",false],["under_contract","Under contract","s-uc",true],["live","Live listings","s-cs",true],["coming_soon","Coming soon","s-bd",true],["potential","Potential","s-pr",true]];
  var total=0, mSegs=BUCKETS.map(function(b){
    var rows=deals.filter(function(d){ return d.moneyBucket===b[0]; });
    var gross=r2(rows.reduce(function(a,d){ return a+(isN(d.ianGross)?d.ianGross:0); },0));
    var keeps=r2(rows.reduce(function(a,d){ return a+(isN(d.ianKeeps)?d.ianKeeps:0); },0));
    total+=gross;
    return {value:gross,label:b[1],cls:b[2],display:K.fmtMoney(gross,{short:true})+(b[3]?" est":""),rows:rows,keeps:keeps,onTap:function(){
      var list=rows.length?K.card({flush:true,body:rows.map(function(d){
        return K.expandRow({title:d.name,sub:d.keyDate?d.keyDateLabel?d.keyDateLabel+" "+K.fmtDate(d.keyDate):K.fmtDate(d.keyDate):(d.keyDateLabel?d.keyDateLabel+" unknown":"No date on file"),
          right:isN(d.ianGross)?K.fmtMoney(d.ianGross):null,rightSub:isN(d.ianKeeps)?"keeps "+K.fmtMoney(d.ianKeeps)+(d.estimate?" est":""):undefined,dotCls:d.moneyBucket==="owed"?"s-owed":(STAGE_CLS[d.stage]||""),tags:d.tags||[]});
      })}):K.emptyLine("No deals in this bucket.");

  var tb=K.el("div","mn-pad");
  tb.appendChild(K.el("div","mn-cap","Should be set aside"));
  var big=K.el("div","mn-bigrow"); big.appendChild(K.el("div","mn-big",M(tax.shouldBeSetAside))); if(tax.estimate!==false)big.appendChild(K.tag("est")); tb.appendChild(big);
  tb.appendChild(K.el("div","mn-small",(isN(tax.rate)?Math.round(tax.rate*100):"unknown")+" percent of "+M(tax.grossReceived)+" gross received this year"));
  var kvs=[];
  if(tax.heldAt)kvs.push({label:"Held at",value:tax.heldAt});
  if(tax.requested&&isN(tax.requested.amount))kvs.push({label:"Requested",value:D(tax.requested.amount)+" on "+K.fmtDate(tax.requested.date)});
  if(kvs.length){ var kw=K.el("div","mn-kv"); kw.appendChild(K.kvList(kvs)); tb.appendChild(kw); }
  if(tax.note)tb.appendChild(K.el("div","mn-note",tax.note));
  var taxBody=[tb];
  if(tax.basis)taxBody.push(K.expandRow({title:"How this is figured",dotCls:false,foot:K.emptyLine(tax.basis)}));
  host.appendChild(K.card({title:"Tax set aside",flush:true,body:taxBody,
    foot:K.asOfFoot({source:"NP Dodge statements and Ian",asOf:ytd.asOf||mo.asOf,estimate:tax.estimate!==false})}));

  /* 5. Card bonuses. A bar only when the target is on file. */
  if(cbs.length){
    var same=cbs.every(function(c){ return c.asOf===cbs[0].asOf; });
    var cbBody=cbs.map(function(c){
      var n=K.daysUntil(c.deadline), right=D(c.left)+" left, "+daysText(n), known=isN(c.target)&&isN(c.left), parts=[], blk;
      if(known)parts.push(D(r2(c.target-c.left))+" of "+D(c.target)+" spent"); else parts.push("Target not on file, so no bar");
      parts.push("Deadline "+K.fmtDate(c.deadline,{year:true}));
      if(isN(c.rewardPoints))parts.push("Bonus "+grp(c.rewardPoints)+" points");
      if(!same)parts.push("As of "+K.fmtDate(c.asOf));
      if(known){
        blk=K.progressBar({label:c.card,right:right,value:r2(c.target-c.left),max:c.target,tone:"amber"});
      } else {
        blk=K.el("div"); var h=K.el("div","pb-h"); h.appendChild(K.el("span",null,c.card)); h.appendChild(K.el("span",null,right)); blk.appendChild(h);
      }
      var w=K.el("div","mn-cb"); w.appendChild(blk); w.appendChild(K.el("div","mn-small",parts.join(". "))); return w;
    });
    host.appendChild(K.card({title:"Card bonuses",body:cbBody,
      foot:same?K.asOfFoot({source:"Amex spend tracker, read by Ian",asOf:cbs[0].asOf,estimate:cbs.some(function(c){ return c.estimate; }),note:"Spend after the as of date is not subtracted."}):null}));
  }

  /* 6. Points, two tiles. Null prints unknown. */
  var mr=pts.amexMR||{}, rk=pts.rakuten||{};
  host.appendChild(K.sectionHead({title:"Points"}));
  host.appendChild(K.chipRow([
    {value:isN(mr.balance)?grp(mr.balance):null,label:"Amex points, last read "+K.fmtDate(mr.asOf)},
    {value:isN(rk.pending)?grp(rk.pending):null,label:"Rakuten points pending, last read "+K.fmtDate(rk.asOf)}]));
  var pl=K.el("div","mn-small");
  var l1="Amex points: "+(mr.source||"source unknown"), l2="Rakuten: "+(rk.source||"source unknown");
  if(isN(rk.balance)&&isN(rk.confirmed))l2+=" Balance "+grp(rk.balance)+" points, "+grp(rk.confirmed)+" confirmed.";
  pl.appendChild(K.el("div",null,l1)); pl.appendChild(K.el("div",null,l2));
  host.appendChild(pl);

  /* 7. Trip points card. Facts only. Renders nothing when trip is missing. */
  var tr=data.trip;
  if(tr){
    var held=isN(mr.balance)?mr.balance:null, need=isN(tr.pointsNeeded)?tr.pointsNeeded:null;
    var exp=(tr.expected||[]).filter(function(x){ return isN(x.points); });
    var expSum=exp.reduce(function(a,x){ return a+x.points; },0);
    var tb2=[];
    if(tr.name)tb2.push(K.el("div","mn-cap",tr.name)); else tb2.push(K.emptyLine("Trip not picked yet"));
    if(need!==null){
      tb2.push(K.progressBar({label:"Points held",right:grp(held)+" of "+grp(need)+" points",value:held,max:need,ghost:(held!==null&&expSum>0)?expSum:null,tone:"violet"}));
    } else {
      tb2.push(K.emptyLine("Points needed: not picked yet"));
    }
    if(exp.length&&need!==null)tb2.push(K.el("div","mn-small",exp.map(function(x){ var tm=x.timing?x.timing.charAt(0).toLowerCase()+x.timing.slice(1):"timing unknown"; return "Hatched: "+x.label+" "+grp(x.points)+", "+tm+", not earned yet."; }).join(" ")));
    if(tr.status)tb2.push(K.el("div","mn-small",tr.status));
    tb2.push(K.el("div","mn-small","Tap for routes and points per part."));
    function cppText(lo,hi){
      if(!isN(lo)&&!isN(hi))return "unknown";
      var a=isN(lo)?lo.toFixed(1):null, b=isN(hi)?hi.toFixed(1):null;
      if(a===null)return b; if(b===null||a===b)return a; return a+" to "+b;
    }
    function openTrip(){
      var nodes=[];
      var top=[{label:"Trip",value:tr.name||null},{label:"Status",value:tr.status||null},{label:"Booking window",value:tr.window||null},
        {label:"Travelers",value:isN(tr.party)?String(tr.party):null},
        {label:"Points held",value:grp(held)+" (read "+K.fmtDate(mr.asOf)+")"},
        {label:"Points needed",value:need===null?"not picked yet":grp(need)+" for "+(isN(tr.party)?tr.party:"unknown")}];
      nodes.push(K.card({body:K.kvList(top)}));
      (tr.options||[]).forEach(function(o){
        var rows=[], b=K.el("div");
        if(o.dates)b.appendChild(K.el("div","mn-cap",o.dates));
        (o.parts||[]).forEach(function(p){ rows.push({label:p.program+", "+p.label,value:grp(p.perPerson)+" each, "+grp(p.forParty)+" for "+(isN(tr.party)?tr.party:"unknown")}); });
        rows.push({label:"Total points for "+(isN(tr.party)?tr.party:"unknown"),value:isN(o.points)?grp(o.points):null});
        rows.push({label:"Taxes",value:isN(o.taxes)?(o.taxesApprox?"about ":"")+D(o.taxes)+" est":null});
        rows.push({label:"Cents per point",value:cppText(o.cppLow,o.cppHigh)+" cents est"});
        if(isN(o.withoutBonus))rows.push({label:"Without the "+((tr.bonus&&tr.bonus.program)||"transfer")+" bonus",value:(o.withoutBonusApprox?"about ":"")+grp(o.withoutBonus)});
        b.appendChild(K.kvList(rows));
        if(o.note)b.appendChild(K.el("div","mn-note",o.note));
        nodes.push(K.card({title:o.label+(o.role==="backup"?", backup":", main trip"),sub:isN(o.points)?grp(o.points)+" points":null,body:b,foot:K.asOfFoot({source:o.source,asOf:tr.asOf,estimate:true})}));
      });
      if(tr.bonus){
        var bn=K.daysUntil(tr.bonus.ends), bt=bn===null?"unknown":(bn<0?"ended":(bn===0?"today":bn+(bn===1?" day left":" days left")));
        nodes.push(K.card({title:"Transfer bonus on file",body:[K.kvList([{label:"Program",value:tr.bonus.program},{label:"Bonus",value:isN(tr.bonus.pct)?tr.bonus.pct+" percent":null},{label:"Ends",value:K.fmtDate(tr.bonus.ends,{year:true})+", "+bt}]),tr.bonus.note?K.el("div","mn-note",tr.bonus.note):null],foot:K.asOfFoot({source:tr.bonus.source,asOf:tr.asOf})}));
      }
      if(exp.length){
        nodes.push(K.card({title:"Expected points",body:K.kvList(exp.map(function(x){ return {label:x.label,value:grp(x.points)+". "+(x.timing||"Timing unknown")+", not earned yet."}; })),foot:K.asOfFoot({source:exp[0].source,asOf:"2026-11-23"})}));
      }
      if((tr.conflicts||[]).length){
        nodes.push(K.card({title:"Not reconciled",body:tr.conflicts.map(function(c){ return K.emptyLine(c); }),foot:K.asOfFoot({source:"the files named in the line",asOf:tr.asOf})}));
      }
      K.sheet({title:"Trip points",node:nodes});
    }
    host.appendChild(K.card({title:"Trip points",body:tb2,onTap:openTrip,foot:K.asOfFoot({source:"point.me award search",asOf:tr.asOf,note:"Points held last read "+K.fmtDate(mr.asOf)+"."})}));
  }

  /* 8. Foot */
  host.appendChild(K.el("div","mn-foot")).appendChild(K.asOfFoot({source:"Plaid read only, the Amex tracker, Rakuten and Ian",asOf:mo.asOf}));
};

/* PAGE:house BEGIN */
APP.pages.house=function(host,data){
  var h=data.home;
  if(!h){ host.appendChild(K.emptyLine("House data is not on file")); return; }
  var t=h.targets||{}, sv=h.savings||{}, cb=h.cashByAugust||{}, pr=h.priceRule||{}, pa=Array.isArray(h.plannedAdds)?h.plannedAdds:[];
  function isN(v){ return typeof v==="number"&&isFinite(v); }
  function D(v){ return K.fmtMoney(v); }
  function line(t2){ return K.el("div","hs-line",t2); }
  var cur=isN(sv.current)?sv.current:null;

  /* Countdown. Month ends left from today up to the target date, this month included. */
  var days=K.daysUntil(h.targetDate), months=null, tp=String(h.targetDate||"").match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(tp){
    var now=new Date(), tgt=Date.UTC(+tp[1],+tp[2]-1,+tp[3]), today=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()), n=0, y=now.getFullYear(), m=now.getMonth();
    for(var i=0;i<600;i++){ var endDay=Date.UTC(y,m+1,0); if(endDay>=tgt)break; if(endDay>=today)n++; m++; if(m>11){ m=0; y++; } }
    months=n;
  }
  function need(target){
    if(cur===null||!isN(target))return null;
    if(target-cur<=0)return 0;
    if(!months)return null;
    return Math.ceil((target-cur)/months);
  }
  function needText(v){ return v===null?"unknown":(v===0?"Reached":D(v)+" a month"); }
  var sub=(days===null?"unknown days":(days<=0?"Target date reached":days+(days===1?" day":" days")))+(h.targetNote?". "+h.targetNote+".":".");
  var heroBody=K.el("div");
  heroBody.appendChild(K.hero({label:"Countdown to "+K.fmtDate(h.targetDate,{year:true}),value:months,format:"int",unit:months===1?"month":"months",sub:sub,tone:"teal"}));
  if(months!==null)heroBody.appendChild(K.el("div","hs-small","Counts month ends from now to the target, this month included."));
  heroBody.appendChild(K.el("div","hs-cap","Needed each month to reach the safe target"));
  heroBody.appendChild(K.kvList([{label:"Low target",value:needText(need(t.safeLow))},{label:"High target",value:needText(need(t.safeHigh))}]));
  host.appendChild(K.card({hero:true,tone:"teal",body:heroBody}));

  /* Fund. A track from $0 to the high safe target with two zones. No fill until a balance is set. */
  var fb=K.el("div"), row=K.el("div","hs-bigrow");
  row.appendChild(K.el("div","hs-big",cur===null?"Not set":D(cur)));
  fb.appendChild(row);
  if(isN(t.safeHigh)&&t.safeHigh>0){
    var bar=K.progressBar({value:cur===null?0:Math.min(cur,t.safeHigh),max:t.safeHigh,tone:"teal"}), trk=bar.querySelector(".pb-t");
    var zone=function(lo,hi,cls){
      if(!isN(lo)||!isN(hi)||hi<lo)return;
      var z=K.el("div","hs-z "+cls); z.style.left=(lo/t.safeHigh*100)+"%"; z.style.width=((hi-lo)/t.safeHigh*100)+"%"; trk.insertBefore(z,trk.firstChild);
    };
    zone(t.closingLow,t.closingHigh,"cl"); zone(t.safeLow,t.safeHigh,"sf");
    var tw=K.el("div","hs-trk"); tw.appendChild(bar); fb.appendChild(tw);
    var ax=K.el("div","hs-ax"); ax.appendChild(K.el("span",null,"$0")); ax.appendChild(K.el("span",null,D(t.safeHigh))); fb.appendChild(ax);
    var lg=K.el("div","hs-lg"), l1=K.el("div"), l2=K.el("div");
    l1.appendChild(K.el("i","hs-sw cl")); l1.appendChild(K.el("span",null,"Closing costs "+K.fmtRange(t.closingLow,t.closingHigh)));
    l2.appendChild(K.el("i","hs-sw sf")); l2.appendChild(K.el("span",null,"Safe target "+K.fmtRange(t.safeLow,t.safeHigh)));
    lg.appendChild(l1); lg.appendChild(l2); fb.appendChild(lg);
  }
  host.appendChild(K.card({title:"Fund",sub:"Savings toward the home",body:fb}));

  /* Cash by August, a range, always an estimate. */
  var cbw=K.el("div"), cbb=K.el("div","hs-bigrow"); cbb.appendChild(K.el("div","hs-big",K.fmtRange(cb.low,cb.high))); cbb.appendChild(K.tag("est"));
  cbw.appendChild(cbb); cbw.appendChild(K.el("div","hs-small","With both optional adds."));
  host.appendChild(K.card({title:"Cash by August",body:cbw}));

  /* Planned adds. Plans, not balances: nothing here is added into the fund. */
  var paRows=pa.map(function(a){
    var sub=[a.timing,a.note].filter(function(x){ return !!x; }).join(". ");
    return K.expandRow({title:a.label,sub:sub||undefined,right:isN(a.amount)?(a.approx?"About ":"")+D(a.amount):null,dotCls:false,tags:a.approx?["est"]:[]});
  });
  var paAsOf=pa.reduce(function(m2,a){ return (a.asOf&&String(a.asOf)>m2)?String(a.asOf):m2; },"");
  var paCard=K.card({title:"Planned adds",flush:true,body:pa.length?paRows.concat([K.el("div","hs-note","Plans only. Not part of the fund balance above.")]):K.emptyLine("No planned adds on file"),
    foot:pa.length?K.asOfFoot({source:"Ian",asOf:paAsOf||null}):null});
  paCard.classList.add("hs-wrap"); host.appendChild(paCard);

  /* Price rule, 2 by 2. */
  host.appendChild(K.card({title:"Price rule",body:K.el("div","hs-rows")}));
  var prBody=host.lastChild.querySelector(".card-b");
  prBody.appendChild(K.chipRow([{value:D(pr.house),label:"House goal"},{value:D(pr.houseStretch),label:"House stretch"}]));
  prBody.appendChild(K.chipRow([{value:D(pr.duplex),label:"Duplex goal"},{value:D(pr.duplexStretch),label:"Duplex stretch, about"}]));

  /* The scenario and the levers, plain lines. */
  var sc=Array.isArray(h.scenario)?h.scenario:[], lv=Array.isArray(h.levers)?h.levers:[];
  function lines(list,none){ if(!list.length)return K.emptyLine(none); var w=K.el("div"); list.forEach(function(x){ w.appendChild(line(x)); }); return w; }
  host.appendChild(K.card({title:"The scenario Ian likes",body:lines(sc,"No scenario on file")}));
  host.appendChild(K.card({title:"Levers",body:lines(lv,"No levers on file")}));

  /* Docs, links in a new tab. */
  var docs=Array.isArray(h.docs)?h.docs:[];
  var dl=docs.map(function(d){
    var a=K.el("a","hs-doc"); a.href=d.url; a.target="_blank"; a.rel="noopener noreferrer";
    a.appendChild(K.el("span",null,d.label)); var ch=K.el("span","xr-ch"); ch.appendChild(K.icon("chev")); a.appendChild(ch); return a;
  });
  host.appendChild(K.card({title:"Docs",flush:true,body:dl.length?dl:K.emptyLine("No documents on file")}));

  /* Foot */
  host.appendChild(K.el("div","hs-foot")).appendChild(K.asOfFoot({source:h.source||"BRAIN HOME_PURCHASE_2027.md",asOf:sv.asOf||h.asOf||null}));
};

/* SHELL BEGIN */
var TABS=[{id:"home",label:"Home"},{id:"deals",label:"Deals"},{id:"income",label:"Income"},{id:"money",label:"Money"},{id:"house",label:"House"}];
var VIEW_KEY="ianDash.v3", UNLOCK_KEY="ianDash.unlock", CODE="2007";
var view={tab:"home"}, entered="";
function $(id){ return document.getElementById(id); }
function loadView(){ try{ var v=JSON.parse(localStorage.getItem(VIEW_KEY)||"null"); if(v&&typeof v.tab==="string"&&APP.pages[v.tab])view.tab=v.tab; }catch(e){} }
function saveView(){ try{ localStorage.setItem(VIEW_KEY,JSON.stringify(view)); }catch(e){} }
function readBuild(){ var m=document.querySelector('meta[name="build"]'); APP.build=m?m.getAttribute("content"):"unknown"; }
function readData(){
  try{
    var node=$("app-data"); if(!node)throw new Error("The data block is missing.");
    var d=JSON.parse(node.textContent);
    if(!d||typeof d!=="object"||!d.meta)throw new Error("The data block is empty.");
    APP.data=d;
  }catch(e){ APP.data=null; APP.dataError=String(e&&e.message?e.message:e); }
}
function errorCard(title,msg){ return K.card({title:title,body:[K.emptyLine(msg),K.emptyLine("Nothing is lost. The next morning refresh rewrites the data. Build: "+APP.build+".")]}); }
function render(){
  var host=$("page"), tab=view.tab; host.textContent="";
  TABS.forEach(function(t){ var b=$("tab-"+t.id); if(b){ b.classList.toggle("on",t.id===tab); b.setAttribute("aria-current",t.id===tab?"page":"false"); } });
  var meta=TABS.filter(function(t){ return t.id===tab; })[0]||TABS[0];
  $("hdrTitle").textContent=meta.label;
  $("hdrSub").textContent=APP.data?"Data from "+K.fmtDate(APP.data.meta.generatedAt,{time:true}):"";
  if(!APP.data){ host.appendChild(errorCard("The data did not load",APP.dataError||"The data block could not be read.")); return; }
  try{ APP.pages[meta.id](host,APP.data); }
  catch(e){ host.textContent=""; host.appendChild(errorCard("This page hit an error",String(e&&e.message?e.message:e))); }
  if(!host.firstChild)host.appendChild(K.emptyLine("Nothing to show."));
}
function go(tab){ view.tab=tab; saveView(); render(); window.scrollTo(0,0); }
function buildTabs(){
  var nav=$("tabs");
  TABS.forEach(function(t){ var b=el("button","tab"); b.id="tab-"+t.id; b.appendChild(K.icon(t.id)); b.appendChild(el("span",null,t.label)); b.addEventListener("click",function(){ go(t.id); }); nav.appendChild(b); });
  $("aboutBtn").appendChild(K.icon("info")); $("aboutBtn").addEventListener("click",openAbout);
  $("upd").addEventListener("click",function(){ location.reload(); });
}
/* Update check: fetch this page with a cache buster and compare the build tag. The only network request the app makes. */
function checkForUpdate(done){
  if(location.protocol==="file:"){ if(done)done("local"); return; }
  try{
    fetch(location.pathname+"?cb="+Date.now(),{cache:"no-store"}).then(function(r){ return r.ok?r.text():""; }).then(function(html){
      var m=html.match(/name="build" content="([^"]+)"/);
      if(m&&m[1]&&m[1]!==APP.build){ $("upd").classList.add("show"); if(done)done("new"); } else if(done)done(m?"same":"fail");
    }).catch(function(){ if(done)done("fail"); });
  }catch(e){ if(done)done("fail"); }
}
function openAbout(){
  var d=APP.data, rows=[{label:"Build",value:APP.build},{label:"Data generated",value:d?K.fmtDate(d.meta.generatedAt,{time:true,year:true}):"unknown"}];
  var src=el("div");
  ((d&&d.meta.sources)||[]).forEach(function(s){
    var r=el("div","src"), h=el("div","src-h"); h.appendChild(el("span",null,s.name)); h.appendChild(K.tag(s.read?{text:"read",tone:"green"}:{text:"not read"})); r.appendChild(h);
    r.appendChild(el("div","src-n","As of "+K.fmtDate(s.asOf,{year:true})+(s.note?". "+s.note:""))); src.appendChild(r);
  });
  if(!src.firstChild)src.appendChild(K.emptyLine("No source list in the data."));
  var status=K.emptyLine(""), btn=el("button","btn","Check for update");
  btn.addEventListener("click",function(){
    status.textContent="Checking...";
    checkForUpdate(function(res){ status.textContent=res==="new"?"A newer build is live. Close this and tap Reload.":res==="same"?"You are on the latest build.":res==="local"?"The update check runs on the live site only.":"Could not reach the live site."; });
  });
  K.sheet({title:"About",node:[K.card({body:K.kvList(rows)}),K.card({title:"Sources",sub:"where each number comes from",body:src}),btn,status]});
}
/* Lock. A soft convenience lock, the code lives in the file. The unlock lasts for the browser session. */
function isUnlocked(){ try{ return sessionStorage.getItem(UNLOCK_KEY)==="1"; }catch(e){ return false; } }
function dots(){ var ds=document.querySelectorAll("#lockDots .dot"); for(var i=0;i<ds.length;i++)ds[i].classList.toggle("on",i<entered.length); }
function press(k){
  var sub=$("lockSub");
  if(k==="del"){ entered=entered.slice(0,-1); dots(); return; }
  if(entered.length>=4)return;
  sub.classList.remove("err"); sub.textContent="Enter passcode"; entered+=k; dots();
  if(entered.length===4)setTimeout(function(){
    if(entered===CODE){ try{ sessionStorage.setItem(UNLOCK_KEY,"1"); }catch(e){} entered=""; unlock(); }
    else{ entered=""; dots(); sub.textContent="Wrong passcode"; sub.classList.add("err"); var w=$("lockDots"); w.classList.remove("shake"); w.getBoundingClientRect(); w.classList.add("shake"); }
  },150);
}
function buildKeypad(){
  var kp=$("keypad");
  ["1","2","3","4","5","6","7","8","9","","0","del"].forEach(function(k){
    if(k===""){ kp.appendChild(el("div")); return; }
    var b=el("button","key"+(k==="del"?" fn":"")); if(k==="del"){ b.setAttribute("aria-label","Delete"); b.appendChild(K.icon("del")); } else b.textContent=k;
    b.addEventListener("click",function(){ press(k); }); kp.appendChild(b);
  });
  document.addEventListener("keydown",function(e){ if(!document.body.classList.contains("locked"))return; if(/^[0-9]$/.test(e.key))press(e.key); else if(e.key==="Backspace")press("del"); });
}
function unlock(){ document.body.classList.remove("locked"); render(); checkForUpdate(); }
function boot(){
  readBuild(); readData(); loadView(); buildTabs(); buildKeypad();
  if(isUnlocked())unlock();
  document.addEventListener("visibilitychange",function(){ if(!document.hidden&&!document.body.classList.contains("locked"))checkForUpdate(); });
}
try{ boot(); }
catch(e){ document.body.classList.remove("locked"); var p=$("page"); if(p){ p.textContent=""; p.appendChild(el("div","card","The app could not start. "+String(e&&e.message?e.message:e))); } }
/* SHELL END */
})();
</script>
