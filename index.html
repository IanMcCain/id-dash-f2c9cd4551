const PK_SKILL_CONTENT={"meta":{"generated":"2026-07-29","scaleAnchor":{"note":"The old 0 to 100 scale was never defined beyond 'roughly 70 is a solid 3.5 to 4.0', which is why the numbers drifted upward unchecked. This is the explicit anchor now.","formula":"value = (rating - 3.0) * 30 + 30","points":{"3.0":30,"3.25":38,"3.5":45,"3.75":53,"4.0":60,"4.5":75,"5.0":90}},"ratingContext":"Ian is UNRATED. He has no DUPR. His first real rating gets set at the APC men's doubles 3.5 with Dylan on 2026-08-23. Every number here is a coach estimate from footage and will be checked against reality in under four weeks. Estimates were revised DOWN across all seven skills on 2026-07-29 after Ian pushed back that they were generous."},"skills":[{"id":"hands","label":"Speed ups and hands","short":"Hands","rating":2.75,"value":22,"previousValue":60,"delta":-38,"confidence":"high","confidenceNote":"THREE independent sources now agree, which no other skill on this board can claim. Frame by frame absence across a full tournament day on 2026-07-25. Ian's unprompted read on 2026-07-30 calling hands and kitchen line defence mediocre, given before he saw the grade. And a specific mechanism on 2026-07-31: hard balls and speed ups at the kitchen get popped up and slammed. The first two established that he never initiates; the third establishes that he also cannot absorb. Offence and defence are both confirmed gaps, from separate evidence, which is why this is the most confidently rated skill here despite being the lowest. MECHANISM NOTE, 08.02.2026: the overgrip came off, which is an equipment change that plausibly explains part of the reported gain, so confidence that the IMPROVEMENT is skill has gone DOWN even as reports of it continue. TREND NOTE, 08.01.2026: the three sources above established the gap. Two further self reports since have described it IMPROVING. Confidence in the GAP remains high; confidence that the number is still CURRENT is now the open question, which is a different thing and is why footage of net exchanges is the priority.","position":"TRENDING, AND THERE IS NOW A MECHANICAL CAUSE ATTACHED. Ian took the overgrip off the paddle on 08.02 because it was too bulky, and both the hands gain and a NEW depth problem on drives, dinks and drops date from that one change. Read the improvement as part equipment and part skill, and read the long balls as its price. THE THING TO WATCH NEXT IS THE DEPTH, NOT THE HANDS. Three consecutive self reports, read as one line rather than three notes: 07.30 hands and kitchen line defence MEDIOCRE. 07.31 cannot absorb pace at close range, hard balls and speed ups at the kitchen get popped up and slammed. 08.01 hands at the net A LOT BETTER, a lot quicker, a lot more confident. Two sessions of reported improvement running, on the exact weakness the film independently confirmed, with a plausible mechanism attached (quicker plus confident is what improving absorption looks like from the inside). The rating below has NOT moved and will not until there is footage, but if any number on this radar is about to be wrong in his favour it is this one. FILM THIS NEXT. Your weakest skill by a wide margin, and it was rated your third strongest. Across three tournament games on 2026-07-25 you hit ZERO speed ups. Not few, none. On 2026-07-26 in advanced games you said outright that one opponent had a strong speed up and you could not have handled it. The standard at 3.5 is that you lose hands battles at the net. You are not losing them, you are not entering them.","grounding":["2026-07-25 tournament film, all three games: no speed-ups the entire day, near-zero finishing, high balls that could have ended points were reset back into a dink instead.","2026-07-26 advanced doubles, Ian's own report: an opponent's strong speed up was mostly aimed at his partner and he admits he could not have handled it.","2026-07-22 film synthesis: logged as 'flaw by ABSENCE, he rarely initiates offense', with speed-up DEFENSE separately flagged for popping balls up.","2026-07-30 open play, Ian's own report (SELF REPORT, not film, does not move a rating on its own): he calls kitchen line defense and hands MEDIOCRE, unprompted. This AGREES with the 07.25 tournament film, which found zero speed ups across a full day, and the two are independent: his read of the night and a frame by frame count of a different day. Agreement from two independent sources makes hands the most confidently rated skill on the board rather than the least.","2026-07-31 open play, Ian's own report (SELF REPORT, not film, does not move a rating on its own): THE FAILURE IS NOW SPECIFIC, and it is the same weakness from the other side. Against experienced players, when a speed up or a hard ball comes at him AT THE KITCHEN he pops it up and it gets slammed on him and his partner. His words: quick hands in general not very good. The film found the ABSENCE of offence, zero speed ups across a tournament day; this is the DEFENCE half, an inability to absorb pace at close range. THIRD independent source now pointing at hands: the 07.25 tournament film, his 07.30 unprompted read, and this. The contrast he draws himself isolates the variable: against balls that are NOT hard he dinks aggressively and forces THEM to pop up. So the dinking is fine. It is specifically pace at close quarters that breaks him.","2026-08-01 open play, Ian's own report (SELF REPORT, not film, does not move a rating on its own): \"my hands at the net were a lot better\" and \"a lot quicker\", \"a lot more confident at the net\". THIRD CONSECUTIVE SELF REPORT ON HANDS AND THE SECOND SHOWING IMPROVEMENT. Note the two words that matter: QUICKER and CONFIDENT at the net are precisely the mechanism you would expect if the absorb problem were resolving, rather than a vague good feeling. Still no footage, so the rating does not move, but this is now the strongest candidate for a genuine improvement anywhere on this board.","2026-08-02, THE MECHANICAL CAUSE. Ian took the OVERGRIP OFF the paddle because it felt too bulky, and since then his hands are a lot faster. That is a real equipment change, not a mood, and it lands exactly where the hands improvement appears. A thinner grip means less mass in the hand, a lower swingweight and a head that feels lighter, which is precisely the mechanism behind quicker at the net. This partly DOWNGRADES the earlier reading that absorption itself was resolving: some of this gain is the paddle, not the player, and it reverses the day he puts a grip back on. It also predicts a cost, and the cost has already shown up. See the depth problem now attached to drives, dinks and drops. INFERRED CHANGE DATE, between the 07.31 and 08.01 sessions, most likely right before 08.01. On 07.31 he rated dinks good, drops decent, and could not absorb pace. On 08.01 hands jumped AND dinks, drives and drops all fell to mid in the same session. One change explains all four at once; four unrelated changes in one night does not. Label: INFERRED, Ian can pin the exact day. Read every session before 08.01 as the gripped paddle and every session after as the bare one."],"right":["Your paddle work on defence is not panicked. You block and absorb rather than swinging wildly.","You do not spray errors trying offense you do not have. The absence is a choice, not a failure of execution."],"wrong":["You cannot absorb pace at close range. A hard ball or a speed up at the kitchen gets popped up and put away, by his own account on 2026-07-31. This is the DEFENSIVE half of the gap and it is newly specific: the film established the absence of offence, this establishes the absence of a block. Note the control condition in the same report, against balls that are NOT hard he dinks aggressively and forces the pop up, so the hands problem is pace at close quarters, not the soft game.","You never initiate. Zero speed ups across roughly 28 minutes of tournament footage is the single most concrete finding in the whole film record.","You decline free offense. When a ball sits up, the film shows you resetting it back into a dink instead of finishing. That is a decision you are making every time.","Your paddle starts low between shots. The 2026-07-22 dink drill shows you standing tall and letting the paddle hang at your side during resets and transitions. Most of what feels like slow hands at your level is a paddle that started at the hip.","You have no counter. By your own account an advanced speed up would have gone through you. Defence and offense are both untrained here."],"drills":[{"id":"pbk-wall-0720","name":"Wall volley drill","detail":"Rapid fire volleys 5 to 7 feet from a wall, 30 seconds on and 30 off, 5 rounds. Paddle resets to centre after every ball. Highest transfer thing you can do alone.","partner":"solo"},{"id":"pbk-rapidfire-0720","name":"Rapid fire hands","detail":"Feeds every 1 to 2 seconds at chest from 10 to 12 feet, 3 rounds of 20 to 30 balls. Judged on whether the paddle got back to centre before the next ball, NOT on whether you won it.","partner":"partner or club ball machine"},{"id":"pbk-dinkdinkbang","name":"Dink dink bang","detail":"Cooperative dinks, then either player speeds up without warning. The point of the drill is that you are the one who initiates half the time. Track how often you pull the trigger, not how often you win the exchange.","partner":"Dylan"},{"id":"pbk-attackthesitup","name":"Attack the sit up","detail":"Partner feeds deliberately attackable balls at shoulder, hip and middle. Every single one gets attacked. No resets allowed. Retrains the decision, which is the actual fault.","partner":"Dylan or girlfriend"}],"toLevelUp":{"target":"3.5, which means entering hands battles and sometimes winning them","requirements":["Paddle up and out front in the triangle BEFORE the ball is struck. This is worth more than everything else combined and it is free.","Speed up off any ball that sits up to shoulder, hip or middle. Not the perfect ball, any ball. The habit has to exist before it can be selective.","On court reps at speed, because reaction is perceptual and neural. The gym is genuinely last here and worth two short blocks a week, no more. Nothing you lift will make you see the ball sooner.","Grip loose, firming only at contact. That is a habit, not a strength quality."],"honestTimeline":"This is trainable fast because the fault is a decision, not a mechanic. Expect visible change in three to four weeks of deliberate reps. It will not be ready for Aug 23."}},{"id":"drops","label":"Drops and thirds","short":"Drops","rating":3,"value":30,"previousValue":50,"delta":-20,"confidence":"high","confidenceNote":"Counted from a full 4 fps pass across all 174 seconds of a self feed drill, 0 seconds skipped.","position":"Below 3.5, and this is the skill you have named your top priority. In a calm self feed drill with no opponent and no pressure, more than half the reps missed. The 3.5 standard is attempting drops with a plan and developing consistency. Your plan is right. Your execution fails in the easiest condition the sport offers.","grounding":["2026-07-22 drop drill, about 64 reps: real error rate 55 to 60 percent once deep floaters are counted as misses. Net clearance of 88 percent flatters the number, because clearing the net is not the same as landing the drop.","2026-07-22 drop drill: the dominant miss is DEEP drift past the kitchen, not netting. This is the opposite of what you believe about your own drops.","2026-07-25 tournament film: drop DECISIONS were correct throughout and the drops were functional at beginner pace, but contact was the fault, taken low and on the move.","2026-07-30 open play, Ian's own report (SELF REPORT, not film, does not move a rating on its own): he rates drops and resets at half court and back UNDER PRESSURE as the best he has done, while explicitly declining to call it a big improvement. This SITS AGAINST the 07.22 film, which counted a 55 to 60 percent error rate in a calm self feed drill. Both can be true: the film is 07.18 to 07.25 and this is 07.30, so it may be real movement, or his standard for good is still miscalibrated. UNRESOLVED and testable. Film drops under pressure to settle it.","2026-08-01 open play, Ian's own report (SELF REPORT, not film, does not move a rating on its own): \"my drops were mid\". DOWN from 07.31, where he rated them decent. Part of the same trade: attention went to the net and the rest of the game gave a little back.","2026-08-02: also slightly LONG since the overgrip came off. Same cause as the drives. Of the three depth misses this is the one that actually loses points, because a drop that runs long is the one that sits up and gets attacked, which is the exact ball his hands then have to survive. Calibration, not technique."],"right":["The stroke shape is clean. This is not a rebuild.","Your drop versus drive decision is correct. On tournament film you chose right every time.","You are not netting many in a calm drill. Your self diagnosis of net dumps is wrong for the drill setting, it belongs to match pressure."],"wrong":["You set up TALL and load LATE, on almost every rep. This is the root fault that also causes your dink pop ups and your low drive contact. One fix, three symptoms.","Your drops drift DEEP past the kitchen. That is your dominant miss pattern and it is not the one you think it is. A deep drop is an attackable drop.","You bend at the WAIST to dig out low transition balls instead of sinking the legs. Seen at frames A_29 and A_91 on 2026-07-25. Beginner pace forgave it. At 3.5 to 4.0 a drop struck low and on the run floats or dies short.","You rise and drift forward through contact rather than staying down through the ball.","Under match pressure the drops stop reaching the kitchen at all. This is the practice to match collapse, and it is the central coaching problem, not a separate one."],"drills":[{"id":"pbk-drop-machine-volume","name":"Ball machine drop volume","detail":"50 to 100 reps in one session from the baseline. The club ball machine is what makes this volume possible solo, and volume was the blocker on your number one weakness.","partner":"club ball machine"},{"id":"pbk-drop-targetkitchen","name":"Drop to a target inside the kitchen","detail":"Put a towel or cones in the kitchen. A rep only counts if it lands on or before the target. Deep floaters score zero. Forces you to grade on landing, not on clearing the net.","partner":"solo or machine"},{"id":"pbk-drop-sinklegs","name":"Low ball leg sink","detail":"Partner feeds deliberately low transition balls. Every rep, you get set with a leg load, no waist bend. Judged on your base, not on the shot.","partner":"Dylan"},{"id":"pbk-drop-pressure","name":"Drops at heart rate","detail":"Last 5 minutes of every drop session. Ten jumping jacks, then drop immediately. A drop grooved at rest is not a drop you own. This exists specifically to close the practice to match gap.","partner":"solo"}],"toLevelUp":{"target":"3.5, which means the drop is consistent even if the motion is still readable","requirements":["SETTLE THE 07.30 DISAGREEMENT WITH FOOTAGE, and film it UNDER PRESSURE, not as another self feed drill. On 07.30 Ian rated drops and resets under pressure the best he has done; the 07.22 self feed drill counted 55 to 60 percent errors. A calm drill cannot adjudicate a claim about pressure, so a repeat of it settles nothing. This is the single highest value thing to film next.","Sink the legs and load early. Get low BEFORE the ball arrives, not as it arrives.","Grade every rep on where it LANDS, not on whether it cleared. Your 88 percent clearance is hiding a 55 to 60 percent failure.","Volume. 50 to 100 reps per session on the machine, not 15 in a warm up.","Then and only then, reps under pressure, because consistency comes before technique per your own stated priority."],"honestTimeline":"This is the slowest of the seven to move because it is a genuine mechanical rebuild of your base, not a decision. Months, not weeks. It will not be at 3.5 by Aug 23 and that is fine, the drop is a two year skill."}},{"id":"serve","label":"Serve","short":"Serve","rating":3.25,"value":38,"previousValue":55,"delta":-17,"confidence":"medium","confidenceNote":"Mechanics are high confidence from 60 fps footage. Landings are low confidence to Unknown, because the 2026-07-22 camera could not resolve the far court and deep serves rolled out of frame. The match miss rate is Ian's own report, not film.","position":"The motion is genuinely good and the outcome is not, and the rating goes on the outcome. The 3.5 standard is you consistently get the ball in play but lack depth and direction. That is you exactly. 4.0 wants developed spin and depth with limited unforced errors, and you are missing roughly a quarter of your preferred serve in real games.","grounding":["2026-07-22 serve drill, 40 to 50 reps: motion clean, LEGAL and highly repeatable. Contact below the waist at thigh height, paddle head below the wrist, low to high path, long follow through over the left shoulder.","2026-07-22 serve drill: depth ran SHALLOW, a clear cluster of balls built up at the far kitchen line and net base. A handful drifted wide right.","2026-07-26 advanced doubles, Ian's report: missed about 4 to 5 serves over 2 full games, and the preferred power plus topspin serve nets about 25 percent of the time.","2026-07-23 open play, Ian's report: the 80 to 85 percent power serve nets about half the time in a match, so he bails to a slow serve that is too easy to attack.","2026-07-27 breakthrough: slowing the serve 10 to 15 percent gets it in a lot more consistently, and stepping back to reset helps when he wants pace.","2026-07-30 open play, Ian's own report (SELF REPORT, not film, does not move a rating on its own): the serve was VERY BAD for roughly the first hour and a half of a 2h49m session, then he got it down and was consistent for the rest. He drew the fix himself, drill the serve before playing rather than warming it up in live points. Consistent with the 07.27 finding that the motion is sound and the failure is a cold start plus match pressure, not technique.","2026-07-31 open play, Ian's own report (SELF REPORT, not film, does not move a rating on its own): Way better, rated GREAT, and good FROM THE START. He confirmed he ran the pre play drill: five minutes, ten serves per side, immediately before playing. ONE SUPPORTING OBSERVATION, NOT A VALIDATED PROTOCOL. Against 07.30, no drill, serve very bad for roughly the first 90 minutes of a 169 minute session. That is one observation each way, and Ian hedged it himself, correctly: the alternative explanation is that the serve was simply on that night. The decisive test is the opposite case, a session where he SKIPS the drill and the cold start returns. That is to be collected if it happens, never arranged. Full protocol and evidence table in BRAIN, Personal/Context/PRE_PLAY_ROUTINE.md.","2026-08-01 open play, Ian's own report (SELF REPORT, not film, does not move a rating on its own): \"my serves got better\". SECOND session running the pre play drill and second session with an improved serve. Two supporting observations now, still not proof. The framing is unchanged: the live alternative is ordinary variance, and the decisive test remains a session where he SKIPS the drill and the cold start returns.","2026-08-02, CONFOUND. Read the serve trend more carefully now. The overgrip came off between the 07.31 and 08.01 sessions and Ian reports his serves are better since, so the 08.01 improvement has TWO candidate causes, the pre play drill and the grip change, and the drill no longer owns it cleanly. The 07.31 observation still predates the grip change and stays clean. Net effect: ONE clean supporting session for the drill, not two. The decisive test is unchanged."],"right":["The motion is legal on every count and it is repeatable. Nothing here needs rebuilding.","You found the fix yourself on 2026-07-27. Slowing down 10 to 15 percent is the correct answer and you got there without being told.","You are a former tennis player and the athletic base of the serve is not the problem."],"wrong":["Depth runs shallow. A cluster of balls at the far kitchen means a meaningful share of serves land short, which lets the returner step in and take time away. Depth is the entire point of a serve.","You have no repeatable MATCH serve. In practice it is good, in a game the power version nets a quarter to half the time and you bail to something attackable. That gap IS the skill.","A few drift wide right, repeatedly enough to be a pattern rather than noise.","You are choosing between a serve that misses and a serve that gets punished. Neither is a 3.5 serve."],"drills":[{"id":"pbk-serve-backthird","name":"Back third target serve","detail":"Basket of balls, target the back third of the box to the backhand. Only serves landing in the back third count. Ignore how it felt.","partner":"solo"},{"id":"pbk-serve-slowdown","name":"The 85 percent serve","detail":"Groove the slowed serve you discovered on 2026-07-27 until it lands 9 of 10, before adding any pace back. Consistency before technique, your own stated priority order.","partner":"solo"},{"id":"pbk-serve-pressure","name":"Pressure serves at heart rate","detail":"Last 5 minutes of every serve session. Ten jumping jacks, then serve immediately. You log 126 to 143 bpm in open play with a max of 184, and a serve grooved at rest is not a serve you own.","partner":"solo"},{"id":"pbk-serve-teninarow","name":"Ten in a row or restart","detail":"Ten consecutive legal serves into the back third. Miss one, the count restarts. Builds the match reliability the drill setting never tests.","partner":"solo"}],"toLevelUp":{"target":"3.5, which means the serve reliably goes in with depth, then 4.0 adds spin and placement variation","requirements":["One serve you can land every single time, at whatever pace that requires. Own it before adding anything.","Depth to the back third. Measure it, do not feel it.","Serve under heart rate, every session, because the failure is a match failure not a technique failure.","Only after it holds: add the pace and topspin back, one variable at a time."],"honestTimeline":"The fastest of the seven to move, because the motion is already sound and it is a closed skill with no opponent input. This is the one skill that can genuinely improve before Aug 23."}},{"id":"dinks","label":"Dinks","short":"Dinks","rating":3.25,"value":38,"previousValue":66,"delta":-28,"confidence":"high","confidenceNote":"Counted across a full 4 fps pass, all 292 seconds, 33 contact sheets, 0 seconds skipped, in a COOPERATIVE drill.","position":"This is one of the two you pushed back on, and you were right to. A 22 to 23 percent pop up rate in a cooperative drill with no pressure is a 3.5 marker at best. The 3.5 standard is dinking with moderate consistency where pop ups still appear. That is a precise description of your dink. 4.0 wants dinks that are patient, purposeful and placed well enough to create openings, and the tournament film says you create none.","grounding":["2026-07-22 dink drill, about 88 contacts: 22 to 23 percent error rate, almost all POP UPS above the net band rather than net dumps.","2026-07-22 dink drill: the BACKHAND is the leakier wing at roughly 15 to 18 percent pop ups versus 6 to 8 percent on the forehand.","2026-07-25 tournament film: dinks are a genuine low pace strength and Games A and C are full of long kitchen rallies, which corrected your own report that you had no chances to dink. But they are NEUTRAL only.","2026-07-25 tournament film: you rarely dink a player wide then behind, at the feet to force a pop up, or into the middle seam. You keep it in, you do not move them. That is why rallies ran 20 to 36 seconds and ended on someone else's terms.","2026-07-31 open play, Ian's own report (SELF REPORT, not film, does not move a rating on its own): Rated good, and the detail matters more than the grade: against balls that are not hard he dinks AGGRESSIVELY and forces the opponent to pop it up. That is offensive dinking, which the 07.25 film said was absent (dinks are NEUTRAL, you dink to not lose). Either this is real movement since the tournament, or it only shows up against players who are not applying pace. It is the control condition that isolates pace as the thing that breaks him, and it is worth filming.","2026-08-01 open play, Ian's own report (SELF REPORT, not film, does not move a rating on its own): \"my dinks were mid\". DOWN from 07.31, where he rated them good and described dinking aggressively to force pop ups. Recorded because the honest read of this session is a TRADE, not an across the board gain.","2026-08-02: also running slightly LONG since the overgrip came off, same cause as the drives and smaller in magnitude because the swing is shorter. Placement is fine, depth is the miss. This is part of why 08.01 read as mid rather than good, and it is a calibration problem rather than a technique problem."],"right":["You are patient and you do not lose the dink rally. You survived a 36 second all four at the kitchen war against a better team.","You do not back off the kitchen line under a long exchange.","Your self report that you get no chances to dink was wrong, and wrong in your favour. You get plenty and you handle them."],"wrong":["Roughly one in five dinks floats above net height in a COOPERATIVE drill. Under real pressure that number goes up, not down. Every one of those is an attackable ball you handed over.","Your backhand dink leaks at more than twice the rate of your forehand. That is your leakier wing everywhere and it is untested at real pace, because beginner dinks lack the speed to expose it.","You lift high or fast balls instead of blocking them down.","You stand tall between dinks, same root fault as the drop.","Placement is safe rather than constructive. No wide then behind, no at the feet, no middle seam. A dink that does not move anyone is a rally extender, not a shot."],"drills":[{"id":"pbk-dink-nopopup","name":"Under the tape","detail":"Cooperative dinks where any ball crossing above net height ends the rep, regardless of whether it landed in. Grades the actual fault instead of the outcome.","partner":"Dylan or girlfriend"},{"id":"pbk-dink-backhandonly","name":"Backhand only crosscourt","detail":"Every ball taken on the backhand wing. Your backhand pops at double the forehand rate and it gets the volume until that closes.","partner":"Dylan or machine"},{"id":"pbk-dink-widebehind","name":"Wide then behind","detail":"Two dinks wide to pull them off court, third one behind them into the space. Trains construction, which is entirely absent from your game.","partner":"Dylan"},{"id":"pbk-dink-atthefeet","name":"Dink at the feet","detail":"Target the opponent's feet rather than the open court, deliberately manufacturing the pop up you then attack. Pairs directly with the hands drills.","partner":"Dylan"}],"toLevelUp":{"target":"3.5 properly, which means the pop up rate falls under about 10 percent under pressure, then 4.0 adds construction","requirements":["Block down on fast or high balls instead of lifting. The pop ups are almost all lift.","Stay low between dinks. Standing tall between shots is why the paddle is late.","Backhand volume until it matches the forehand rate.","Then placement. Wide then behind, at the feet, the middle seam. Moving people is the whole difference between a 3.5 dink and a 4.0 dink."],"honestTimeline":"The consistency half is weeks. The construction half is the same skill as your number one ceiling and moves on the same slow timeline as the drop."}},{"id":"drives","label":"Drives","short":"Drives","rating":3.5,"value":45,"previousValue":72,"delta":-27,"confidence":"medium","confidenceNote":"The 18 percent figure aggregates the whole drive and transition loop including the transition drops, so the pure drive is likely better than 18 percent. The mechanical fault and the under use are high confidence.","position":"Your best skill of the seven and it was still rated too high. You were carrying a 72, which reads as low 4.0. The 3.5 standard is a consistent medium paced shot lacking directional control and depth variation, and that is where you are. 4.0 wants power, spin and variation in depth and speed, which you do not have yet.","grounding":["2026-07-22 drive drill, about 100 to 140 contacts: roughly 18 percent error, and critically ALL of it SOFT, short or popped. Zero hard net and zero out. The errors concentrate in the transition drop, not the drive itself.","2026-07-22 drive drill: a long LOOPING over the head take back on every drive and overhead, the paddle going far back and UP behind the head instead of a compact shoulder turn. Slow and telegraphed.","2026-07-25 tournament film: you used the drive under control with no wild banger swing and did not drive into set opponents. The standing 'too bangery, drifts forward' worry in the knowledge base DID NOT SHOW and has now been retired.","2026-07-25 tournament film: you UNDER USE it as a weapon. Balls sat up that you could have driven and you did not.","2026-08-01 open play, Ian's own report (SELF REPORT, not film, does not move a rating on its own): \"my drives were mid\". Flat to slightly down, and consistent with the trade rather than a separate problem.","2026-08-02, NEW PROBLEM AND IT IS THE ONE TO WATCH. Since the overgrip came off, HIS DRIVES GO LONG. Placement is still good, DEPTH is what changed. This is the price of the same equipment change that sped his hands up, not a separate fault and not a mechanics regression. Thinner grip, lower swingweight, lighter feeling head, so the same swing he has grooved for months now produces more head speed than his calibration expects and the ball carries past the baseline. A long drive is an unforced error with no rally attached, which makes it more expensive than the hands gain is valuable. THIS IS THE NEXT THING TO WORK ON, ahead of celebrating the hands trend. It is also CORRECTABLE and it is a calibration fix, not a technique rebuild: same swing, less intent, and re anchor the target to the baseline rather than the back fence. Give it two or three sessions. If depth has not settled by then, the honest answer is to put a thin grip back on and accept the slower hands, because long balls cost more points than fast hands win."],"right":["You do not drive into set opponents. That is a shot selection error most 3.5 players make constantly and you do not make it.","No wild banger swing on tournament film. The old worry about you being too bangery is now formally disproven, not softened.","Your errors are all soft, never hard. You are not spraying the ball long or into the tape at pace."],"wrong":["The take back is a long loop up behind your head. It is slow, it is telegraphed, and an opponent reads it before you swing. A compact shoulder turn is the fix and it is the single mechanical change worth making here.","You take transition balls too low and reach forward while still walking in, instead of getting set. Same root fault as the drop.","You under use it. On tournament film there were drivable balls you declined, which is the same not to lose instinct that shows up in your hands.","No depth or speed variation. Every drive is roughly the same drive."],"drills":[{"id":"pbk-drive-compact","name":"Compact take back drive","detail":"Drive with the paddle never going above shoulder height on the back swing. Film it or have Dylan watch the back swing, not the ball. The fault is invisible to you while hitting.","partner":"Dylan or machine"},{"id":"pbk-drive-setfeet","name":"Stopped base drive","detail":"Every drive struck from a stopped, set base. No hitting while walking in. If you are still moving, you let the ball go.","partner":"machine"},{"id":"pbk-drive-threespeeds","name":"Three speeds","detail":"Same swing shape at 70, 85 and 100 percent, called out before each rep. Builds the variation a 4.0 drive has and yours does not.","partner":"machine"},{"id":"pbk-drive-takeit","name":"Take the drivable ball","detail":"Partner mixes in balls that sit up. Every one gets driven. Pairs with the hands work, because both faults are the same declined offense.","partner":"Dylan"}],"toLevelUp":{"target":"4.0, which means adding pace variation and disguise to a drive that is already well selected","requirements":["Compact the take back. This is the one mechanical fix and it also speeds up your hands, because the same loop shows on overheads.","Get set before you hit. Stop taking transition balls on the walk.","Actually use it. A weapon you decline is not a weapon.","Then variation in pace and depth, which is what separates 3.5 from 4.0 here."],"honestTimeline":"Closest of the seven to its next level. The selection is already there, which is the hard half. Weeks on the back swing."}},{"id":"resets","label":"Resets","short":"Resets","rating":3.5,"value":45,"previousValue":58,"delta":-13,"confidence":"medium","confidenceNote":"Scope matters more than the number here. Confirmed across three separate sessions AT LOW TO MEDIUM PACE, which is strong for that condition and says nothing about any other. The film states plainly that nobody has ever made him reset a genuinely hard ball, so this is a low pace reset rating, not a reset rating. On 2026-07-31 he reported the first evidence from the untested case, close court resets against hard balls and speed ups, and reported it as NOT good. That case is recorded under hands, because at the kitchen against pace there is no time, and time is the variable, not court position.","position":"Genuinely your best trait and the smallest correction of the seven, because this one was closest to honest. It holds at low and medium pace across three sessions. The reason it is not higher is that nothing has ever tested it at real pace, and an untested strength is a 3.5 strength.","grounding":["2026-07-21 club match film: survived long dink, reset and firefight exchanges against a clearly stronger pair, staying low and in play across four separate rallies.","2026-07-22 film synthesis: named his BEST trait, low base, contact out front, absorbs pace.","2026-07-25 tournament film: confirmed again, survived a 36 second all four at the kitchen war in Game A at t143 to t179. Described as one long recovery clinic.","2026-07-25 tournament film: digs low balls out of transition, resets under pressure, gets back to the kitchen. Not a problem area.","2026-07-31 open play, Ian's own report (SELF REPORT, not film, does not move a rating on its own): He splits resets himself: mid to far back court resets GOOD, close court resets into the kitchen NOT good. This does not contradict the film, it fills the exact hole the film named. Every reset ever graded was at low or medium pace, and the film says outright that what he has is a low pace reset, not a reset, and that speed up defence did not appear enough to judge. So this is the FIRST observation of the untested case. Read the variable as TIME, not court position: back court gives him time even against pace, the kitchen gives him none. The kitchen half of what he is describing is hands, which is where it is recorded, not a second reset skill."],"right":["Low base, contact out front, absorbs pace. The mechanics are correct and they hold up.","It survived contact with a better team on 2026-07-21, which is the only time anything of yours has been tested upward.","You recover well and get back to the kitchen rather than staying stuck in transition."],"wrong":["Close range under pace is a different shot and it is not covered by this number. On 2026-07-31 Ian reported that back court resets held while resets into the kitchen against hard balls did not. Do not read this rating as covering the kitchen under pace; that is hands.","Tentative contact on the first ball under pressure. The reset itself is fine, the first ball of the point is where it leaks.","The reset is purely defensive. You reset to survive, never to gain ground. A reset that drifts you forward into the kitchen is the same shot with a purpose.","Untested at real pace. Beginner and soft game opponents have never made you reset a genuinely hard ball, so what you have is a low pace reset, not a reset.","You use it as an escape hatch from balls you should be attacking. Some of what looks like a good reset on film is you declining a finish."],"drills":[{"id":"pbk-reset-hardfeed","name":"Hard feed reset","detail":"Partner or machine drives at you at genuine pace from mid court. Only way to find out whether the reset holds above the speed anyone has hit you at.","partner":"Dylan or machine"},{"id":"pbk-reset-advance","name":"Reset and advance","detail":"Every reset must be followed by taking two steps of ground. Turns a survival shot into a positional one.","partner":"Dylan"},{"id":"pbk-reset-firstball","name":"First ball only","detail":"Play out points that end after the third shot. Isolates the first ball under pressure, which is where the tentative contact lives.","partner":"Dylan"}],"toLevelUp":{"target":"4.0, which means the reset holds against real pace and gains ground","requirements":["Get hit at hard. Nothing else tests this and nobody has tested it yet.","Reset forward, not just in. Gain the kitchen off the reset.","Stop using it to decline offense. Some resets should have been finishes.","Firm up the first ball. The reset is good, the first ball of the point is tentative."],"honestTimeline":"Mostly a matter of exposure rather than training. Play up and this number will move on its own, or be revealed as lower than we think."}},{"id":"footwork","label":"Footwork","short":"Footwork","rating":3.5,"value":45,"previousValue":62,"delta":-17,"confidence":"medium","confidenceNote":"Read from bird's eye tournament footage which shows movement well. The 2026-07-21 read called it passive and the 2026-07-25 read corrected that to active, so this number has already moved once on evidence.","position":"Better than the knowledge base used to say and still not 4.0. The 3.5 standard is purposeful movement and getting to the kitchen quickly, which you do. What keeps it at 3.5 is that your base mechanics on low balls are wrong and you do not always hold the line with your partner.","grounding":["2026-07-25 tournament film: footwork is more ACTIVE than the earlier 'passive' label. You get to the kitchen, you lunge, you recover well. Late in Game A around t470 to t500 you were still lunging to the kitchen, so no visible late match collapse.","2026-07-25 tournament film: you BEND AT THE WAIST on low balls instead of a leg loaded sink, frames A_29 and A_91.","2026-07-25 tournament film, Game C around t285 to t300: you hung BACK while Bianca was up, leaving one up one back instead of getting up together.","2026-07-22 film synthesis: feet described as surviving the rally rather than setting up offense."],"right":["You get to the kitchen and you get there with your partner most of the time.","You lunge and recover rather than watching balls go by.","No visible movement collapse late in matches, which contradicts your own fatigue self report."],"wrong":["Waist bend instead of leg sink on low balls. This is the single most correctable thing on the list and it is the root of your drop and dink faults too.","Your feet survive the rally rather than setting up offense. You move to reach the ball, not to create a position to attack from.","One up one back lapses. In Game C you hung back while Bianca was up, which is the seam a better team attacks.","No split step discipline visible on film ahead of the opponent's contact."],"drills":[{"id":"pbk-foot-sink","name":"Leg sink on every low ball","detail":"Partner feeds only low balls. Every rep judged on your base, not the shot. If you bent at the waist the rep does not count regardless of where the ball went.","partner":"Dylan"},{"id":"pbk-foot-splitstep","name":"Split step on their contact","detail":"Split step timed to the opponent's contact, every ball, for a whole game. Ignore the score.","partner":"Dylan"},{"id":"pbk-foot-upTogether","name":"Up together","detail":"Play points where the pair must arrive at the kitchen together or the point is forfeit. Directly targets the one up one back lapse.","partner":"Dylan or Bianca"}],"toLevelUp":{"target":"4.0, which means positioning that creates advantages rather than positioning that survives","requirements":["Sink the legs. This one change improves drops, dinks and footwork at the same time, which is why it is the highest leverage fix in the whole assessment.","Split step on their contact, every ball, until it is automatic.","Move to set up a shot, not to reach a ball.","Hold the line with your partner without exception."],"honestTimeline":"Weeks for the split step and the up together habit. The leg sink is a months long base change because it is the same rebuild as the drop."}}],"unrated":[{"id":"return","label":"Return of serve","reason":"Never isolated in any of the nine sessions. Return depth could not be measured from any camera angle used. The 2026-07-25 film caught the post return positioning only. Your historical net dumps are believed to live here but there is no evidence either way.","howToRate":"Film one session from behind YOUR OWN baseline. That single change would make the return countable and would also finally make serve landings resolvable. It is the highest value filming fix available and it has been recommended since 2026-07-21."},{"id":"overheads","label":"Overheads and put aways","reason":"Near absent from the record rather than poor. High balls that could have been ended were reset back into a dink on 2026-07-25, so there is almost nothing to grade. The one mechanical note is that the same long looping take back from the drive shows up on overheads.","howToRate":"It will grade itself once the hands and finishing work starts producing attempts."}],"overall":{"estimatedRating":"3.25, weighted toward the skills that decide points","previousImpliedRating":"roughly 3.9 to 4.0 from the old radar values","selfEstimate":"3.5, which Ian has carried since 2026-07-27","note":"The old radar said 3.9 to 4.0 while the same knowledge base file said Ian is a 3.5. Those two numbers sat 30 lines apart and contradicted each other for six days. The radar was never anchored to a defined scale, so every nudge went upward and nothing pulled it back.","verdict":"You are a genuinely solid soft game 3.25 to 3.5 with one real strength (resets), one correctable weapon (drives), and a hole where offense should be. Aug 23 will test this. A first DUPR off a handful of games is provisional and swings on the draw, so treat Aug 24 as a data point, not a verdict."}};

   the evidence values and does NOT overwrite them. The gap between what he thinks and what the film
   shows is the most useful coaching information on the page, and replacing one with the other erases
   it. Both are plotted.

   Conversion uses the same anchor as everything else, value = (rating - 3.0) * 30 + 30:
     serve     3.0  to 3.25  mid 3.125  -> 33.8   film 38 (3.25)   he is 0.12 UNDER the film
     drops     3.25          mid 3.25   -> 37.5   film 30 (3.0)    he is 0.25 OVER
     resets    3.25 to 3.5   mid 3.375  -> 41.2   film 45 (3.5)    he is 0.12 UNDER
     dinks     3.5           mid 3.5    -> 45.0   film 38 (3.25)   he is 0.25 OVER
     drives    3.5  to 3.75  mid 3.625  -> 48.8   film 45 (3.5)    he is 0.12 OVER
     hands     3.0  to 3.25  mid 3.125  -> 33.8   film 22 (2.75)   he is 0.38 OVER, the widest gap
     footwork  3.25 to 3.5   mid 3.375  -> 41.2   film 45 (3.5)    he is 0.12 UNDER

   MIDPOINT, not a band. A band needs an inner and an outer polygon with a fill between them, and
   this chart already carries five rings, a dashed target and a filled Now polygon. A sixth and
   seventh outline at 390px is the exact clutter that was just cleaned off this card. The range is
   not lost, it is printed in words in the drill down where there is room for it. */
const PK_SELF_ASSESS={
  date:"2026-07-30",
  source:"Ian's own read on his game, given 07.30.2026",
  ranges:{ serve:[3.0,3.25], drops:[3.25,3.25], resets:[3.25,3.5], dinks:[3.5,3.5],
           drives:[3.5,3.75], hands:[3.0,3.25], footwork:[3.25,3.5] }
};
/* module level, deliberately NOT persisted. It only decides full grow vs subtle replay, and it
   resetting on a real page reload is the correct behaviour, not a bug. */
var PK_RADAR_SEEN=false; /* build 202: no longer read. The radar's own reveal driver was folded into the shared chart engine, which tracks seen state in CH_SEEN. Kept as a harmless declaration rather than deleted so nothing that may still reference it throws. */
function pkAnchor(rating){ return (Number(rating)-3.0)*30+30; }
function pkSelf(id){
  var r=PK_SELF_ASSESS.ranges[id]; if(!r) return null;
  var lo=r[0], hi=r[1], mid=(lo+hi)/2;
  return { lo:lo, hi:hi, mid:mid, value:pkAnchor(mid),
           label:(lo===hi)?String(lo):(lo+" to "+hi) };
}

function skillDetailPanel(host,id){
  var C=(typeof PK_SKILL_CONTENT!=="undefined")?PK_SKILL_CONTENT:{skills:[],unrated:[]};
  var s=(C.skills||[]).filter(function(x){ return x&&x.id===id; })[0];
  var u=(C.unrated||[]).filter(function(x){ return x&&x.id===id; })[0];
  var c=card("a-violet"); var b=c._body; c.style.marginTop="12px";

  var head=el("div","between");
  var ht=el("div"); ht.style.cssText="font-weight:800;font-size:17px;letter-spacing:-.02em";
  ht.textContent=(s&&s.label)||(u&&u.label)||id;
  head.appendChild(ht);
  var x=el("button","bx","×"); x.style.cssText="background:none;border:0;color:var(--gray);font-size:20px;line-height:1;cursor:pointer";
  x.onclick=function(ev){ ev.stopPropagation(); try{ if(!state.meta) state.meta={}; state.meta.skOpen=null; }catch(e){} try{ render(); }catch(e){} };
  head.appendChild(x); b.appendChild(head);

  var para=function(txt,cls){ var d=el("div","small"); d.style.cssText="line-height:1.6;color:var(--gray);margin-top:8px"; d.textContent=txt; if(cls) d.className="small "+cls; b.appendChild(d); return d; };
  var heading=function(t,color){ var d=el("div","small"); d.style.cssText="margin-top:15px;margin-bottom:2px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;font-size:11px;color:"+(color||"var(--gray)"); d.textContent=t; b.appendChild(d); };
  /* v21 build 194: bullets show the FIRST SENTENCE only. Ian said the panel was too long and wanted
     bullet points, but the fault detail is the part he actually reads, so nothing is deleted. The
     opening sentence of each point carries the finding, and the full wording sits one level deeper
     under "Longer version". This is a mechanical split on sentence boundaries, no rewriting, because
     the coaching content is authored by the research agent and must not be paraphrased here. */
  var firstSentence=function(t){
    t=String(t||"").trim();
    var m=t.match(/^[\s\S]*?[.!?](?=\s|$)/);
    var head=m?m[0].trim():t;
    /* One sentence is the bullet. The threshold only guards against a fragment so short it carries
       no meaning; a punchy opener like "You never initiate." is exactly what Ian asked for and must
       stand alone rather than dragging the following sentence up with it. */
    if(head.length<18 && head.length<t.length){
      var rest=t.slice(head.length).trim();
      var m2=rest.match(/^[\s\S]*?[.!?](?=\s|$)/);
      if(m2) head=(head+" "+m2[0].trim()).trim();
    }
    return head;
  };
  var bullets=function(arr,cap){
    (arr||[]).slice(0,cap||3).forEach(function(t){
      var r=el("div","small"); r.style.cssText="line-height:1.5;color:var(--gray);margin-top:6px;display:flex;gap:7px";
      var dot=el("span"); dot.style.cssText="color:var(--gray);opacity:.55;font-weight:800;flex:0 0 auto"; dot.textContent="•";
      var tx=el("span"); tx.textContent=firstSentence(t);
      r.appendChild(dot); r.appendChild(tx); b.appendChild(r);
    });
  };

  /* ---- UNRATED ---- */
  if(!s&&u){
    var badge=el("span","pill"); badge.textContent="NOT RATED"; badge.style.cssText="display:inline-block;margin-top:9px;border:1px dashed var(--line);color:var(--gray);background:transparent";
    b.appendChild(badge);
    if(u.reason){ heading("Why there is no number"); bullets([u.reason],1); }
    if(u.howToRate){ heading("How to make it gradeable"); bullets([u.howToRate],1); }
    if(u.reason||u.howToRate){
      var ud=el("details"); ud.style.cssText="margin-top:13px";
      var us=el("summary"); us.textContent="Longer version";
      us.style.cssText="font-size:12px;color:var(--gray);font-weight:700;cursor:pointer;opacity:.85"; ud.appendChild(us);
      [u.reason,u.howToRate].forEach(function(t){ if(!t) return; var d=el("div","small"); d.style.cssText="line-height:1.55;color:var(--gray);margin-top:8px"; d.textContent=t; ud.appendChild(d); });
      b.appendChild(ud);
    }
    host.appendChild(c); return;
  }
  if(!s){ para("No coach content for this skill yet. Your research agent fills these in."); host.appendChild(c); return; }

  /* ---- RATED ----
     v21 build 194: the level chip is the ONLY status shown. The previous build put a red "down 38
     from 60" chip next to it. Ian does not want a rating that moved down called out, in red or in
     any softened form, so the delta, the arrow and the previous value are gone completely rather
     than restyled. The number stands on its own. */
  var chips=el("div"); chips.style.cssText="display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:9px";
  var lvl=el("span","pill g"); lvl.textContent=s.rating+" level"; chips.appendChild(lvl);
  if(s.confidence){ var cf=el("span","pill"); cf.textContent=s.confidence+" confidence"; cf.style.cssText="background:var(--card2);color:var(--gray)"; chips.appendChild(cf); }
  b.appendChild(chips);

  /* build 196: his own call against the film, stated plainly. No red, no arrow, no warning colour,
     per his instruction on the old delta chip. It reports two numbers and the distance between them
     and leaves the conclusion to Aug 23. Note this compares his MIDPOINT to the film rating; his
     full range is printed so nothing is hidden behind the midpoint. */
  (function(){
    var sv=(typeof pkSelf==="function")?pkSelf(id):null;
    if(!sv||typeof s.rating!=="number") return;
    var gap=sv.mid-s.rating;
    var mag=Math.abs(gap).toFixed(2).replace(/0$/,"");
    heading("Your call vs the film");
    /* one fact per bullet. Bullets render only their first sentence, so packing "You said X. The
       film says Y." into a single string silently dropped the film number. Decimals are safe, the
       sentence split needs whitespace after the period, so 3.25 does not break. */
    var line1="You said "+sv.label+(sv.lo!==sv.hi?(", mid "+sv.mid):"");
    var line2="The film says "+s.rating;
    var line3=(Math.abs(gap)<0.01)
      ? "Your read and the footage agree here"
      : (gap>0 ? "That is "+mag+" of a rating above the footage" : "That is "+mag+" of a rating below the footage");
    bullets([line1,line2,line3],3);
  })();
  if(s.position){ heading("Where it sits"); bullets([s.position],1); }
  if(s.wrong&&s.wrong.length){ heading("Going wrong"); bullets(s.wrong,3); }
  if(s.right&&s.right.length){ heading("Going right"); bullets(s.right,2); }
  if(s.toLevelUp&&s.toLevelUp.requirements&&s.toLevelUp.requirements.length){
    heading("Work on"); bullets(s.toLevelUp.requirements,3);
  }
  if(s.drills&&s.drills.length){
    heading("Drills");
    s.drills.slice(0,3).forEach(function(d){
      var row=el("div","between"); row.style.cssText="display:flex;align-items:center;gap:8px;margin-top:7px";
      var nm=el("div","small"); nm.style.cssText="font-weight:700;color:var(--white);line-height:1.4;flex:1;min-width:0";
      nm.textContent=d.name||"Drill"; row.appendChild(nm);
      if(d.partner){ var pg=el("span","pill"); pg.textContent=d.partner; pg.style.cssText="background:var(--card2);color:var(--gray);font-size:10px;flex:0 0 auto"; row.appendChild(pg); }
      b.appendChild(row);
    });
  }

  /* everything that is genuinely a paragraph lives one level deeper, per Ian's own note that a
     thing too long to bullet belongs deeper rather than staying as prose on the surface */
  var det=el("details"); det.style.cssText="margin-top:14px";
  var sm=el("summary"); sm.textContent="Longer version";
  sm.style.cssText="font-size:12px;color:var(--gray);font-weight:700;cursor:pointer;opacity:.85";
  det.appendChild(sm);
  var deep=function(title,arr){
    if(!arr||!arr.length) return;
    var h=el("div","small"); h.style.cssText="margin-top:11px;font-weight:800;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--gray);opacity:.8";
    h.textContent=title; det.appendChild(h);
    arr.forEach(function(t){ if(!t) return; var d=el("div","small"); d.style.cssText="line-height:1.55;color:var(--gray);margin-top:6px"; d.textContent=t; det.appendChild(d); });
  };
  deep("Where it sits",[s.position]);
  deep("Going wrong",s.wrong);
  deep("Going right",s.right);
  if(s.toLevelUp) deep("Work on",[s.toLevelUp.target?("Target, "+s.toLevelUp.target):null].concat(s.toLevelUp.requirements||[]).filter(Boolean));
  if(s.drills&&s.drills.length) deep("Drills",s.drills.map(function(d){ return (d.name||"Drill")+(d.detail?". "+d.detail:""); }));
  if(s.confidenceNote) deep("On the confidence",[s.confidenceNote]);
  deep("Evidence",s.grounding);
  b.appendChild(det);
  host.appendChild(c);
}

function buildSkillsRadar(parent){
  var pb=state.pickleball||{};
  var DEF=[{"id":"hands","label":"Speed ups and hands","short":"Hands","current":22,"rating":2.75,"target":60},{"id":"drops","label":"Drops and thirds","short":"Drops","current":30,"rating":3,"target":60},{"id":"serve","label":"Serve","short":"Serve","current":38,"rating":3.25,"target":60},{"id":"dinks","label":"Dinks","short":"Dinks","current":38,"rating":3.25,"target":60},{"id":"drives","label":"Drives","short":"Drives","current":45,"rating":3.5,"target":60},{"id":"resets","label":"Resets","short":"Resets","current":45,"rating":3.5,"target":60},{"id":"footwork","label":"Footwork","short":"Footwork","current":45,"rating":3.5,"target":60}];
  var UNRATED=[{"id":"return","label":"Return of serve","short":"Return","unrated":true},{"id":"overheads","label":"Overheads and put aways","short":"Overheads","unrated":true}];
  /* build 193: unrated skills are held in pb.skills so the app knows about them, but they must NOT
     enter the polygon. Plotting a skill with no number at zero would drive a spike into the middle
     of the chart and read as "terrible" when the truth is "never filmed". They render as their own
     row under the map instead. */
  var skAll=(Array.isArray(pb.skills)&&pb.skills.length)?pb.skills:DEF;
  var sk=skAll.filter(function(x){ return x && !x.unrated && typeof x.current==="number"; });
  if(!sk.length) sk=DEF;
  var c=card("a-blue"); var b=c._body;
  b.appendChild(el("h3",null,"Skills radar"));
  var sub=el("div","small dim"); sub.style.marginTop="3px"; sub.textContent="Coach estimate, regraded 07.29 and revised down. Rings are real levels, 3.0 to 5.0. Not a measured DUPR, your first is Aug 23."; b.appendChild(sub);
  var n=sk.length, cx=150, cy=140, R=92;
  function ang(i){ return (-90 + i*360/n)*Math.PI/180; }

  var g='<svg viewBox="0 0 300 300" width="100%" style="display:block;margin:12px auto 0;max-width:330px;overflow:visible" xmlns="http://www.w3.org/2000/svg">';
  /* v21 build 193: the rings used to sit at 25/50/75/100, which meant nothing. Under the scale
     anchor (value = (rating-3)*30+30) they now sit on REAL levels, so the distance between two
     rings is a genuine half point of rating rather than a quarter of an arbitrary bar. */
  var RINGS=[{v:30,t:"3.0"},{v:45,t:"3.5"},{v:60,t:"4.0"},{v:75,t:"4.5"},{v:90,t:"5.0"}];
  RINGS.forEach(function(r){ var _out=(r.v===90); g+='<polygon points="'+poly(function(){return r.v;})+'" style="fill:none;stroke:'+(_out?"var(--gray)":"var(--line)")+';opacity:'+(_out?0.8:0.26)+'" stroke-width="'+(_out?1.4:1)+'"/>'; });
  /* v21 build 194: THE NUMERIC TICK LABELS ARE GONE. They ran straight down the vertical axis, which
     is the worst line on a radar to put anything on: the Serve label owns the top of that axis and
     the plotted polygon covers the bottom of it, so 3.0 sat half hidden under the fill and the middle
     of the chart read as clutter. The other placements are no better at 390px. Outside the outer ring
     collides with the seven axis labels that already sit there. Fewer ticks still collides with Serve.
     Any off axis position lands inside the polygon on at least one skill as the numbers move.
     So the numeric scale is dropped entirely and the RINGS carry the reference instead: the green
     dashed ring is Target 4.0 and the outer grey ring is the 5.0 ceiling, both already named in the
     legend directly underneath. Nothing is lost, because the exact rating for a skill was never
     readable off these ticks anyway, it is one tap away in the panel where it is stated in words. */
  sk.forEach(function(s,i){ var e=pt(i,100); g+='<line x1="'+cx+'" y1="'+cy+'" x2="'+e[0].toFixed(1)+'" y2="'+e[1].toFixed(1)+'" style="stroke:var(--line);opacity:0.3" stroke-width="1"/>'; });
  /* v21 build 196: GROW ON ENTRY. Only the plotted shapes animate. The rings, the spokes, the axis
     labels and the tap targets are all OUTSIDE this group and never move, so nothing is jittering
     around the edges while the shape fills in, and a tap lands correctly from the very first frame
     because the hit circles are already at full size at their final positions.
     The nested translate / scale / translate is deliberate: scaling a bare CSS transform on an SVG
     group needs transform-origin plus transform-box to behave, and Safari has been inconsistent
     about that. Translating to the centre first means a plain scale() collapses to the centre with
     no origin property at all, which works everywhere. */
  g+='<g transform="translate('+cx+','+cy+')"><g class="skgrow"><g transform="translate('+(-cx)+','+(-cy)+')">';
  g+='<polygon points="'+poly(function(s){return s.target;})+'" style="fill:none;stroke:var(--green);opacity:0.92" stroke-width="1.6" stroke-dasharray="4 3"/>';
  /* Ian's own read, plotted UNDER nothing and OVER the target so it stays legible, but deliberately
     subordinate to the evidence line: no fill, no dots, one thin stroke. The purple filled polygon
     is the one grounded in footage and it should still be what the eye lands on first. */
  var selfPts=sk.map(function(s,i){ var sv=pkSelf(s.id); if(!sv) return null; var q=pt(i,sv.value); return q[0].toFixed(1)+","+q[1].toFixed(1); });
  var haveSelf=selfPts.every(function(p){ return !!p; });
  if(haveSelf){ g+='<polygon class="skself" points="'+selfPts.join(" ")+'" style="fill:none;stroke:#ffab3d;opacity:.85" stroke-width="1.4"/>'; }
  g+='<polygon points="'+poly(function(s){return s.current;})+'" style="fill:var(--accent);fill-opacity:0.26;stroke:var(--accent)" stroke-width="2"/>';
  sk.forEach(function(s,i){ var q=pt(i,s.current); g+='<circle cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="2.6" style="fill:var(--accent)"/>'; });
  g+='</g></g></g>';
  sk.forEach(function(s,i){ var lp=pt(i,112); var a=ang(i); var cos=Math.cos(a), sin=Math.sin(a); var an=cos>0.3?"start":(cos<-0.3?"end":"middle"); var dy=sin>0.3?9:(sin<-0.3?-2:3); g+='<text data-skill="'+s.id+'" x="'+lp[0].toFixed(1)+'" y="'+(lp[1]+dy).toFixed(1)+'" style="fill:var(--gray);font-size:10.5px;font-weight:700;cursor:pointer" text-anchor="'+an+'">'+(s.short||s.label)+'</text>'; });
  /* v21 build 192: TAP TARGETS. Ian asked to stop getting one wall of coach text and instead tap a
     single skill to see just that skill. These are invisible 20px circles sitting over each spoke,
     drawn LAST so they win the hit test. 20px because a 2.6px dot is not a phone target, and the
     label is tappable too so either end of the spoke works. Purely additive, the radar itself is
     unchanged. */
  sk.forEach(function(s,i){ var q=pt(i,s.current); g+='<circle class="skhit" data-skill="'+s.id+'" cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="20" style="fill:transparent;cursor:pointer"/>'; });
  g+='</svg>';
  var holder=el("div"); holder.innerHTML=g; b.appendChild(holder);
  /* v21 build 202: the radar's bespoke reveal driver, builds 196 to 201, has been REMOVED and folded
     into the shared chart engine at chRun(). Everything it did, the shared engine now does for every
     chart: play on the element actually becoming visible rather than on app load, once per view, a
     shorter replay on a genuine re entry, prefers-reduced-motion respected, and a hard timer that
     releases the animation whether or not the clock ever advanced. The radar keeps its own skGrowIn
     and skGrowSubtle keyframes, so what Ian approved on his phone is visually unchanged. Two drivers
     doing the same job meant every future change had to be made twice, and the bespoke one already
     carried the only correct answers to problems the rest of the app still had.
     The .skgrow group closes ABOVE this line, before the spoke labels and the 20px hit circles, so
     the tap targets sit outside the animated group and are full size from frame zero. Keep it that
     way: anything moved inside .skgrow becomes a tap target that scales. */
  /* the detail panel lives directly under the map so the map stays on screen, see skillDetailPanel */
  var panel=el("div"); panel.id="sk-detail"; b.appendChild(panel);
  var openId=(state.meta&&state.meta.skOpen)||null;
  var hintEl=null; /* build 194: set below, hidden whenever a panel is open */
  var paint=function(id){
    try{ if(hintEl) hintEl.style.display=id?"none":""; }catch(e){}
    try{ if(!state.meta) state.meta={}; state.meta.skOpen=id; }catch(e){}
    try{ holder.querySelectorAll('[data-skill]').forEach(function(n){
      var on=(n.getAttribute("data-skill")===id);

    }); }catch(e){}

  try{ holder.querySelectorAll('[data-skill]').forEach(function(n){
    n.addEventListener("click",function(ev){ ev.stopPropagation(); var id=n.getAttribute("data-skill");

  }); }catch(e){}
  /* build 194: the hint is always built, and paint() hides it while a panel is open. It used to be
     built only when nothing was open, which meant opening a skill from the not rated chips left
     "Tap any skill on the map" sitting underneath the panel that had just answered it. */
  hintEl=el("div","small dim"); hintEl.style.cssText="text-align:center;margin-top:8px;line-height:1.45";
  hintEl.textContent="Tap any skill on the map for that skill on its own.";
  b.appendChild(hintEl);
  paint(openId);
  var leg=el("div"); leg.style.cssText="display:flex;gap:18px;justify-content:center;margin-top:6px;flex-wrap:wrap";
  function key(varc,txt,dash){ var d=el("div"); d.style.cssText="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--gray);font-weight:600"; var sw=el("span"); sw.style.cssText="width:15px;height:0;border-top:3px "+(dash?"dashed":"solid")+" "+varc+";display:inline-block"; d.appendChild(sw); d.appendChild(document.createTextNode(txt)); return d; }
  leg.appendChild(key("var(--accent)","Film, about 3.25",false));
  if(haveSelf) leg.appendChild(key("#ffab3d","Your call",false));
  leg.appendChild(key("var(--green)","Target 4.0",true));
  leg.appendChild(key("var(--gray)","5.0 ceiling",false));
  b.appendChild(leg);
  /* build 196: one line of framing under the legend rather than repeating it in all seven panels.
     The gap is a question, not a verdict, and there is a date on the calendar that answers it. */
  if(haveSelf){

    gapNote.textContent="Where your read and the film disagree, your first DUPR on Aug 23 settles it.";
    b.appendChild(gapNote);
  }
  /* v21 build 193: UNRATED skills get a real state instead of a zero. Two skills (return of serve,
     overheads) have no evidence behind them, and plotting them at 0 would draw a spike into the
     middle of the chart that reads as "terrible" when the truth is "never filmed". They sit below

  try{
    var un=(Array.isArray(pb.skills)?pb.skills.filter(function(x){return x&&x.unrated;}):[]);
    if(!un.length) un=UNRATED;
    if(un.length){
      var ur=el("div"); ur.style.cssText="margin-top:13px;padding-top:11px;border-top:1px solid var(--line)";

}
function buildPickle(v){ var pb=state.pickleball||(state.pickleball={});

/* ===== v21 build 215: SESSION LOAD STRIP and PER HABIT 14 DAY STRIP ==========================
   Both approved by Ian 08.02.2026. Both reuse the heatmap idiom rather than inventing one.

   THE LEGIBILITY RULE, inherited from the build 207 depth bands and applied again here.
   Every encoding is FOUR DISCRETE STEPS. His sessions cluster between 60 and 170 minutes and his
   efforts between 7 and 10, so a linear ramp over either range separates neighbouring values by a
   few percent and reads as one flat block on a phone. Bands guarantee a visible step.

   WHAT EACH STRIP ANSWERS, because a chart that answers nothing is decoration.
   Session load answers the question Ian raised himself, whether his frequency is holding up
   before August 23. Today that history is a text list and one sentence.
   The habit strip answers which habit is actually the problem. Today the card is five identical
   checkboxes, so a habit at 11 of 14 and one at 14 of 14 look the same. */

/* _pkCls lives inside the heatmap builder's scope and is not reachable here, which the jsdom
   probe caught on the first run. Same rules, same class names, declared where this block can
   see it rather than reaching into another function's scope. */
function _slCls(kind){ var k=String(kind||"").toLowerCase();
  if(/tournament|fall cup|\bapc\b/.test(k)) return "k-tourn";
  if(k.indexOf("league")>=0) return "k-league";
  var dr=/drill/.test(k), pl=/open play|doubles|\bplay\b/.test(k);
  if(dr&&pl) return "k-mix"; if(dr) return "k-drill"; if(pl) return "k-open"; return "k-play"; }
function _slDurBand(m){ return m<45?34:(m<90?56:(m<150?78:100)); }
/* Effort as DIM, the same primitive as the heatmap's --hmdim. A hard session is bright, an easy
   one is knocked back. Unrecorded effort renders at full strength rather than dim, because
   dimming an unknown invents a fact, which is the same call build 207 made for duration. */
function _slEffDim(e){ if(e==null) return 0; return e<=5?0.42:(e<=7?0.26:(e<=8?0.12:0)); }

function pkLoadStrip(parent){
  var ss=pkSorted(); if(!ss.length) return;
  var last=ss.slice(-17);
  var c=card("a-teal"); var b=c._body;
  var head=el("div","between");
  var L=el("div"); L.appendChild(el("h3",null,"Session load"));
  L.appendChild(el("div","small","last "+last.length+" sessions, height is length, brightness is effort"));
  head.appendChild(L); b.appendChild(head);

  var wrap=el("div","slwrap");
  last.forEach(function(s){
    var slot=el("div","slb");
    var mins=pkParseMin(s.duration);
    var f=el("div","slf "+_slCls(s.kind));
    f.style.height=(mins>0?_slDurBand(mins):100)+"%";
    f.style.setProperty("--sldim",String(_slEffDim(pkEffort(s))));
    f.title=s.date+"  "+(s.kind||"Play")+(mins>0?("  "+Math.round(mins)+" min"):"")+(pkEffort(s)!=null?("  effort "+pkEffort(s)):"");
    slot.appendChild(f); wrap.appendChild(slot);
  });
  b.appendChild(wrap);

  /* Three anchored labels, not one per bar. A 16px wide column clips "07/21" to "07/1", which is
     worse than no label at all because it reads as a real date. */
  var ax=el("div","slaxis");
  var fmt=function(d){ return String(d).slice(5).replace("-","/"); };
  ax.appendChild(el("span",null,fmt(last[0].date)));
  ax.appendChild(el("span",null,fmt(last[Math.floor(last.length/2)].date)));
  ax.appendChild(el("span",null,fmt(last[last.length-1].date)));
  b.appendChild(ax);

  /* The sentence under it is the answer, not a caption. Weekly counts, not a total, because the
     question is whether the CADENCE is holding, and a total hides a drop off. */
  var wk=function(from,to){ return ss.filter(function(s){ var d=daysUntil(s.date); return d>=from&&d<=to; }).length; };
  var w0=wk(-6,0), w1=wk(-13,-7), w2=wk(-20,-14);
  var days=daysUntil("2026-08-23");
  var n=el("div","slnote");
  n.innerHTML="<b>"+w0+"</b> this week, <b>"+w1+"</b> last week, <b>"+w2+"</b> the week before."
    +(days>0?(" <b>"+days+"</b> days to the Aug 23 tournament."):"")
    +(w0<w1&&w0<w2?" Cadence is down two weeks running.":(w0>=w1?" Cadence is holding.":""));
  b.appendChild(n);
  parent.appendChild(c);
}

function habitStrip14(){
  var hs=(state.routine&&state.routine.habits)||[]; if(!hs.length) return null;
  var c=card("a-green"); c.classList.add("hst"); var b=c._body;
  var L=el("div"); L.appendChild(el("h3",null,"Last 14 days"));
  L.appendChild(el("div","small","which habit is actually slipping"));
  b.appendChild(L);
  var days=[]; for(var i=13;i>=0;i--){ var d=new Date(); d.setDate(d.getDate()-i); days.push(d); }
  hs.forEach(function(h){
    var row=el("div","hmrow");
    var lab=el("div","hmwk",h.name||"Habit"); lab.title=h.name||""; row.appendChild(lab);
    var cells=el("div","hmcells"); var hit=0, opp=0;
    days.forEach(function(d){
      var k=todayKey(d);
      /* A WEEKLY HABIT IS NOT FAILING ON THE OTHER SIX DAYS. habitActiveOn already knows this and
         the checkbox list already respects it; the strip has to as well or the weigh in reads as
         1 of 14 and looks like the worst habit on the board when it is in fact correct. */
      /* habitActiveOn takes a DATE STRING, not a Date object. Passing a Date made String(dt)
         the long date form, the split produced garbage and every day came back inactive, so the
         whole strip rendered as fourteen not due cells. Caught by the jsdom probe on run one. */
      var active=habitActiveOn(h,k);
      var done=!!(h.log&&h.log[k]);
      var cl="hmc "+(!active?"na":(done?"hit":"miss"));
      var cell=el("div",cl);
      cell.title=k+(active?(done?"  done":"  missed"):"  not due");
      if(active){ opp++; if(done) hit++; }
      cells.appendChild(cell);
    });
    row.appendChild(cells);
    var nn=el("div","hmn "+(opp&&hit===opp?"ok":(opp&&hit<opp*0.8?"warn":"")),hit+"/"+opp);
    nn.title=hit+" of "+opp+" opportunities in 14 days";
    row.appendChild(nn); b.appendChild(row);
  });
  return c;
}

/* The autoLog surface. It renders on the page the change was made to, so the answer is next to
   the thing that changed rather than in a settings screen nobody opens. */
function autoLogCard(area){
  var L=(state.autoLog||[]).filter(function(x){ return x&&x.area===area; }).slice(0,3);
  if(!L.length) return null;
  var c=card("a-blue"); var b=c._body;
  var h=el("div"); h.appendChild(el("h3",null,"Changes I made"));
  h.appendChild(el("div","small","automatic, and why")); b.appendChild(h);
  L.forEach(function(r){
    var w=el("div"); w.style.cssText="margin-top:10px;padding-top:10px;border-top:1px solid var(--card2)";
    var t=el("div"); t.style.cssText="font-size:12.5px;font-weight:800;line-height:1.4"; t.textContent=r.what; w.appendChild(t);
    var y=el("div","small"); y.style.cssText="margin-top:4px;line-height:1.5;color:var(--gray)"; y.textContent=r.why; w.appendChild(y);
    if(r.evidence){ var e=el("div","small"); e.style.cssText="margin-top:4px;line-height:1.5;color:var(--gray2)"; e.textContent=r.evidence; w.appendChild(e); }
    if(r.undo){ var u=el("div","small"); u.style.cssText="margin-top:4px;line-height:1.5;color:var(--gray2);font-style:italic"; u.textContent="Undo: "+r.undo; w.appendChild(u); }
    b.appendChild(w);
  });
  return c;
}

/* Wrapped rather than edited inline, so the original builders keep working untouched and this
   whole block can be lifted out in one piece if it ever needs to be. */
(function(){
  var _hm=habitsModule;
  habitsModule=function(parent){ _hm(parent); safe(parent,function(){ var s=habitStrip14(); if(s) parent.appendChild(s); },"Habit 14 day strip"); };
  var _gm=(typeof gymToday==="function")?gymToday:null;
  if(_gm){ gymToday=function(parent){ _gm(parent); safe(parent,function(){ var a=autoLogCard("Gym"); if(a) parent.appendChild(a); },"Gym auto log"); }; }
})();

})();
</script>

<script id="sc-b74-js">
(function(){
  /* Tint each aggregated card (Today, Stats, More) by the section it belongs to, using the same
     token approach the app uses. Keyword match on the card's pill or its heading/label text.
     Real estate -> blue, pickleball -> green, gym/fitness family -> red, everything else -> orange. */
  var CAT=[
    [/real estate|sphere|listing|\bseller\b|\bbuyer\b|prospect|mailer|\bcma\b|\bcomps?\b|closing|under contract|npdodge|scenic group|solara/i,'--re1','--re2','solara-check'],
    [/pickle/i,'--pk1','--pk2'],
    [/gym|fitness|workout|\blift|strength|push day|pull day|leg day|supplement|creatine|protein|nutrition|recovery|mobility|stretch|\bwater\b|\bhydrat/i,'--gy1','--gy2']
  ];
  /* Solara is its own venture -> orange, not blue. Strip it back out of the RE bucket. */
  var SOLARA=/solara/i;
  function tint(el2,c1,c2){ el2.style.setProperty('--sec','var('+c1+')'); el2.style.setProperty('--sec2','var('+c2+')'); }
  function labelText(card){
    var pill=card.querySelector('.pill'); if(pill&&(pill.textContent||'').trim()) return pill.textContent;
    var sl=card.querySelector('.sectlabel .t, .sectlabel'); if(sl&&(sl.textContent||'').trim()) return sl.textContent;
    var st=card.querySelector('.st-label'); if(st&&(st.textContent||'').trim()) return st.textContent;
    var h=card.querySelector('h1,h2,h3,h4,.title,.ctext'); if(h&&(h.textContent||'').trim()) return h.textContent;
    return card.textContent||'';
  }
  function run(){
    try{
      document.querySelectorAll('#p-home .card, #p-stats .card').forEach(function(card){
        if(card.getAttribute('data-sc')) return;
        var t=(labelText(card)||'').toLowerCase();
        if(!t) return;
        card.setAttribute('data-sc','1');
        if(SOLARA.test(t)){ tint(card,'--misc1','--misc2'); return; }   /* Solara is its own venture -> orange */
        for(var i=0;i<CAT.length;i++){ if(CAT[i][0].test(t)){ tint(card,CAT[i][1],CAT[i][2]); return; } }
        /* unrelated -> orange/yellow (page default already misc, tint explicitly so pills follow) */
        tint(card,'--misc1','--misc2');
      });
    }catch(e){}
  }
  run();
  var sched=false;
  try{ var mo=new MutationObserver(function(){ if(sched) return; sched=true; requestAnimationFrame(function(){ sched=false; run(); }); }); mo.observe(document.body,{childList:true,subtree:true}); }catch(e){}
  setTimeout(run,450); setTimeout(run,1300);
})();
</script>
